omen.1.name=Река течёт вспять
omen.1.description=Однажды утром степная река начинает медленно течь вспять. Через несколько дней то же происходит с меньшими реками и ручьями. Рыба уходит вместе с водой, а старые броды оказываются затоплены.
omen.2.name=Ранняя зима
omen.2.description=Зима приходит слишком рано. Мороз сковывает землю, а узоры инея на окнах и гладких камнях начинают складываться в одну и ту же карту.
omen.3.name=Священный источник
omen.3.description=Священный источник начинает иссякать после того, как люди нарушают запрет этого места. По ночам возле него появляется древний дух, требующий вернуть взятое.
omen.4.name=Гаснущие звёзды
omen.4.description=Каждую ночь с неба исчезает несколько звёзд. Вместе с ними пропадают знакомые пути: путники сбиваются с дороги даже там, где ходили всю жизнь. Старики говорят, что, когда погаснет последнее знакомое созвездие, дорога откроется тому, что не должно вернуться.
omen.5.name=Степь замолкает
omen.5.description=Исчезают голоса птиц, стрекот насекомых и обычные ночные звуки. Даже лошади тревожатся и не хотят отходить от стоянок. В сумерках путники замечают вдали неподвижную фигуру, которая с каждой ночью оказывается всё ближе.
omen.6.name=Проклятое золото
omen.6.description=Найденное в степи золото невозможно отдать, продать или бросить: оно возвращается в Поклажу того, кто унёс его с места находки. Чем дальше путник уходит, тем тяжелее становится золото. Ради него приходится бросать воду, Провизию и другие вещи. В степи уже встречаются погибшие караваны, среди пустых бурдюков и высохших тел которых лежит нетронутое золото.
omen.7.name=Стена саранчи
omen.7.description=На горизонте появляется тёмная полоса. Она растёт, пока не становится ясно: стеной идёт саранча, закрывая небо и уничтожая всё съедобное на своём пути.
omen.8.name=Красные камни
omen.8.description=Камни древнего погребального места покрываются каплями тёмно-красной влаги. Сколько их ни вытирай, к утру она появляется снова. Вскоре такие же капли начинают находить на камнях возле стоянок.
omen.9.name=Багровая луна
omen.9.description=В ночь багровой луны огонь начинает гореть всё слабее. Сначала гаснут костры под открытым небом, затем очаги. Наутро их удаётся разжечь снова, но с каждой следующей ночью пламя держится всё меньше.
omen.10.name=Трещины в небе
omen.10.description=На ночном небе появляются тонкие трещины. С каждой ночью их становится больше, а границы между привычным миром и тем, что находится за ним, становятся всё слабее.
omen.11.name=Ночной цветок
omen.11.description=Ночной цветок, считавшийся вымершим, снова появляется по всей степи. Его аромат опьяняюще прекрасен, но вызывает яркие кошмары.
omen.12.name=Ночной круг
omen.12.description=С наступлением темноты весь скот самостоятельно собирается вокруг человеческих стоянок. Животные отказываются отходить даже за водой. Каждую ночь круг становится теснее, словно они пытаются укрыться среди людей от чего-то в степи.
omen.13.name=Пропавшие тени
omen.13.description=Сначала у нескольких людей исчезают тени. Через несколько дней таких людей становится всё больше. Сами они чувствуют себя как обычно, но животные начинают их бояться.
omen.14.name=Белый зверь
omen.14.description=Охотники говорят о проклятии, которое постигает каждого, кто убивает зверя с белой шерстью: вскоре таких охотников находят мёртвыми. С каждым днём белых зверей становится всё меньше.
omen.15.name=Голоса из колодцев
omen.15.description=Из колодцев доносится слабый смех, который с наступлением ночи превращается в рыдания.
omen.16.name=Чужой рассвет
omen.16.description=Однажды солнце восходит не там, где должно. Только некоторые люди замечают это. На следующий день таких людей становится больше, но остальные уверяют, что солнце всегда вставало именно там.
omen.17.name=Мёртвое дерево
omen.17.description=Одинокое древнее дерево, служившее путникам ориентиром, внезапно засыхает. Когда его ствол раскалывается, внутри обнаруживают свежий кровавый отпечаток человеческой руки.
omen.18.name=Исчезают лица предков
omen.18.description=Лица древних каменных изваяний начинают становиться гладкими, словно их никогда не высекали. Вскоре люди замечают, что в окрестных аулах перестают рождаться дети.
omen.19.name=Следы мёртвого каравана
omen.19.description=На старом караванном пути каждое утро появляются следы множества людей, лошадей и повозок, хотя ночью никто не проходил. Они всегда ведут в одном направлении — и никогда обратно.
omen.20.name=Бледный всадник
omen.20.description=Детям в разных аулах снится один и тот же почти прозрачный бледный всадник. Он едет от стоянки к стоянке и что-то говорит людям, но никто не может разобрать его слов. После каждого такого сна всё больше людей перестают понимать речь друг друга: знакомые слова звучат чужими, а простые разговоры заканчиваются ссорами. Во сне за всадником постепенно начинает гореть степь.
