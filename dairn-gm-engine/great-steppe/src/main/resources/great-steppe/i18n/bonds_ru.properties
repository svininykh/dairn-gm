bond.1=От умершего родственника вам достался **старый пояс с металлической пряжкой** и долг, о котором семья предпочитала не говорить. Недавно незнакомец узнал пряжку и назвал этот долг вслух. Теперь вы хотите узнать, кому и за что задолжал ваш родственник.
bond.2=Много лет назад ваша семья покинула **зимовку**, о которой старшие запрещали говорить. Перед смертью один из них назвал вам её прежнее имя и попросил вернуться туда. Когда вы однажды повторили это имя при постороннем, незнакомец ответил: **«Там вас всё ещё ждут».**
bond.3=Вы носите **монисту** (Мелкий), принадлежавшую дорогому вам человеку, который однажды исчез в степи. Следы давно потеряны, но вы уверены, что этот человек всё ещё жив. Иногда вам встречаются люди, которым мониста кажется знакомой.
bond.4=В старом кургане вы нашли **гладкий кусок горного хрусталя** (Мелкий). На закате, если смотреть сквозь него, вдали иногда проступают очертания места, которого перед вами нет. Порой среди этих очертаний можно заметить движение.
bond.5=Когда-то вы спасли путника от гибели у пересохшего колодца. Перед расставанием он дал вам **серебряную подвеску** (Мелкий) и сказал показать её у любого большого караван-сарая, если вам понадобится помощь. Кто именно откликнется на этот знак, вы не знаете.
bond.6=В тяжёлую зиму соседний род разделил с вашей семьёй последние припасы и помог пережить холод. Старшие считали этот долг давно возвращённым. Но недавно к вам пришёл человек из того рода и произнёс: **«Теперь помощь нужна нам».**
bond.7=Когда-то два рода пользовались одним источником и дорогой к нему. После старой ссоры путь оказался закрыт, а причины вражды почти забыты. Перед смертью старший родственник попросил вас узнать правду и **примирить роды**, если это ещё возможно.
bond.8=Среди семейных вещей вы нашли **старый запечатанный лист** (Мелкий), написанный человеком, чьё имя в роду стараются не произносить. В нём описана далёкая страна: незнакомые города, дороги и **огромные пирамиды из необтёсанного камня**. В конце указана зимовка и написано: **«Если хочешь узнать, откуда пришла эта история, приходи один».**
bond.9=Вы обязаны жизнью влиятельному человеку и носите его **знак** (Мелкий). Он открывает перед вами некоторые двери, но одновременно напоминает о неоплаченном долге. Вы знаете, что однажды этот человек потребует вернуть оказанную услугу.
bond.10=Однажды в степи вы нашли человека, не помнившего своего имени и прошлого. Вы помогли ему добраться до людей, но утром он исчез. Недавно другой путник назвал его совсем иным именем и уверенно заявил, что **этот человек умер много лет назад**.
bond.11=Странствующий сказитель рассказал вам о месте, где **«земля помнит падение звезды»**. Вы не поверили ему, пока он не оставил **кусок выделанной кожи с нанесёнными ориентирами** (Мелкий). Один из этих ориентиров вы уже видели собственными глазами.
bond.12=В пути вы встретили умирающего охотника. Перед смертью он попросил передать **запечатанное письмо** (Мелкий) своим близким. На письме нет имени или места — только незнакомый знак зимы и указание двигаться на север.
bond.13=Однажды вы оставили раненого зверя умирать в степи. С тех пор иногда видите его вдали, но только когда рядом никого нет. Зверь не приближается и не выглядит злым — кажется, он терпеливо ждёт от вас чего-то.
bond.14=В детстве вы обещали близкому другу однажды вернуться с даром, которого больше ни у кого не будет. Вы до сих пор носите сделанный им **браслет** (Мелкий). Прошли годы, но своего обещания вы так и не исполнили.
bond.15=Вдали от дорог вы нашли погибшего путника и похоронили его. При нём не было ничего, что позволило бы узнать имя, кроме **необычного родового знака** (Мелкий). Вы сохранили его, надеясь однажды найти близких погибшего и рассказать, где он остался.
bond.16=Возле древнего кургана вы нашли **костяную свистульку** (Мелкий), наполовину занесённую землёй. Сколько бы вы ни пытались её оставить, она снова оказывается среди ваших вещей. А если подуть в неё в безлюдной степи, иногда издалека приходит тихий ответ.
bond.17=Когда-то незнакомый отряд спас вашу семью и оставил вам **высушенный красный цветок** (Мелкий) как знак долга. Вам велели хранить его и ждать. Когда цветок побелеет, наступит время найти этих людей и вернуть услугу.
bond.18=Странствующий музыкант несколько дней прожил в вашем доме, а затем исчез без прощания. Он оставил **небольшой сыбызғы**. Внутри его полого стебля что-то перекатывается, хотя инструмент выглядит целым. Вы не знаете, было ли это забыто случайно.
bond.19=Во сне к вам прилетела белая ворона с **маленьким белым пером** в клюве. Проснувшись, вы нашли такое же перо (Мелкий) в руке. С тех пор вы несколько раз замечали его появление там, где вскоре происходило нечто необычное.
bond.20=Один из ваших предков нарушил древнюю клятву, последствия которой до сих пор преследуют род. Вам передали его **старую металлическую чашу**. В спокойной воде внутри неё иногда отражается не то, что находится рядом, а неизвестное место, человек или давно прошедшее событие.
