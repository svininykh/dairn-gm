background.rill-runner.name.10=Robin
background.rill-runner.gear.1=Rations (3 uses)
background.rill-runner.gear.2=Torch (3 uses)
background.rill-runner.gear.3=Water Shoes
background.rill-runner.gear.4=Brigandine (1 Armor, _bulky_)
background.rill-runner.gear.5=Compass
background.rill-runner.gear.6=Dagger (d6)
background.scrivener.name=Scrivener
background.scrivener.name.1=Lazlo
background.scrivener.name.2=Stilo
background.scrivener.name.3=Akshara
background.scrivener.name.4=Pisa
background.scrivener.name.5=Ji-Yun
background.scrivener.name.6=Kalamos
background.scrivener.name.7=Hugo
background.scrivener.name.8=Shui
background.scrivener.name.9=Kalam
