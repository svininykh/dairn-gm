background.scrivener.gear.1=Rations (3 uses)
background.scrivener.gear.2=Torch (3 uses)
background.scrivener.gear.3=Quill & Ink
background.scrivener.gear.4=Blank Book
background.scrivener.gear.5=Awl (d6)
background.scrivener.gear.6=Badge (_petty_)
background.aurifex.table.1.prompt=What went horribly wrong?
background.aurifex.table.1.1=There was an explosion, and you lost your sense of smell. Well, almost: you can sniff out gold as a pig does truffles. Take a **Tin of Snuff** (6 uses) to dampen the impact. Use it every day or become _deprived_.
background.aurifex.table.1.2=You dematerialized a beloved pet. Now it follows you around, invisible but always present. Although it cannot interact with the physical realm, you are able to share its senses. (Add a **Fatigue** each time.) It follows basic commands.
background.aurifex.table.1.3=You were exposed to a long-acting truth serum whose effects have yet to wear off. The disorder has its advantages: you cannot repeat lies you've heard, either.
background.aurifex.table.1.4=You were adept at creating _fake_ gold, which is almost as good. Eventually, your ruse was discovered, and you had to make a hasty retreat. Take a heavy **Metal Ingot** and **Gold Powder** (3 uses).
background.aurifex.table.1.5=Your alchemical recipe worked, but a rival stole the blueprint before your claims could be proven. Take a prototype **Blunderbuss** (d12, _blast_, _bulky_) that takes one round to reload, and a taste for revenge.
background.aurifex.table.1.6=Ridiculed for discovering how to turn gold into _lead_, you were a laughing stock. Take a bottle of **Universal Solvent** (2 uses) that dissolves anything it touches into its constituent parts.
background.aurifex.table.2.prompt=What alchemical marvel is the product of your latest ingenuity?
background.aurifex.table.2.1=**Pyrophoric Gel** — A sticky green fluid that catches fire when exposed to air, then burns for 8 hours. Cannot be extinguished (1 use).
background.aurifex.table.2.2=**Blast Sphere** — A head-sized iron ball filled with explosive powder that detonates on impact (d12, _blast_, _bulky_, 1 use).
background.aurifex.table.2.3=**Aqua Vita** — Purifies any liquid, converting it to pure water. Drinking it cures 1d6 STR (1 use).
background.aurifex.table.2.4=**Mimic Stone** — Records a short phrase that can later be played back.
background.aurifex.table.2.5=**Spark Dust** — Ignites easily and quickly. Useful for starting a fire or as an incendiary device (3 uses).
background.aurifex.table.2.6=**Homunculus** — A miniature clay replica of yourself that follows your every command. It hates being enthralled to you and complains bitterly whenever possible. Any damage done to the homunculus is also done to you. 3 HP, 4 STR, 13 DEX, 5 WIL
background.barber-surgeon.table.1.prompt=How have you "improved" yourself?
background.barber-surgeon.table.1.1=You have a replacement **eye** that can magnify objects, act as a telescope, and provide minimal night vision. You cannot wear anything metal on your head, and the presence of strong magnets make you _deprived_.
background.barber-surgeon.table.1.2=One **foot** is mostly metal (kick, d6), and you treat some Tough terrain as **Easy**. Carry a **Oil Can** (6 uses). Without a daily application, you are _deprived_ and noisy.
background.barber-surgeon.table.1.3=One of your fingers has been swapped, the bone replaced by gold and iron. Take a **Hook** and a **Screwdriver** that can attach to the fingertip.
background.barber-surgeon.table.1.4=Both **ears** have been surgically enhanced, tripling your hearing. You can focus on a specific sound, such as a conversation, at a great distance. You wear an ear flap to protect against sudden loud noises (WIL save to avoid temporary paralysis).
background.barber-surgeon.table.1.5=Your **chest** is lined with alchemical sigils, _toughening the skin_ (1 Armor). Wearing other metallic armor nullifies the effect.
background.barber-surgeon.table.1.6=One **arm** is fully metal and comes off at the shoulder. It can be used as a weapon (d8, _bulky_ when not attached) and can move independently if you are within sight of it.
background.barber-surgeon.table.2.prompt=What rare tool is essential to your work?
background.barber-surgeon.table.2.1=**Regrowth Salve** — Regrows a body part over the course of a day. 1 use.
background.barber-surgeon.table.2.2=**Graftgrub** — A small worm that can fuse inanimate objects with parts of the body.  1 use.
background.barber-surgeon.table.2.3=**Woundwax** — Heals wounds from fire or chemicals (restoring full STR) but nothing else. 2 uses.
background.barber-surgeon.table.2.4=**Quicksilver** — A stimulant. Go first in combat, and automatically pass any WIL saves for one hour. _Addictive_: Save STR or become _deprived_ after 24 hours without it. 4 uses.
background.barber-surgeon.table.2.5=**Pneuma Pump** — Portable iron lungs (_bulky_). Enables life-saving surgery or underwater breathing.
background.barber-surgeon.table.2.6=**Lodestone** — Draws out dangerous elements from the body and acts as a powerful magnetic force.
background.beast-handler.table.1.prompt=What creature is your specialty?
background.beast-handler.table.1.1=**Arachnids** — Take a **Quick-Flame Rod** and an **Oil Can** (6 uses). It can destroy a large spider nest in seconds.
background.beast-handler.table.1.2=**Felines** — Take a sack of **Whiskerwort**. Its odor can calm and control even the largest of cats.
background.beast-handler.table.1.3=**Canines** — Take a wreath of **Wolfsbane** and a **Large Net**. Effective against werewolves as well.
background.beast-handler.table.1.4=**Birds** — Take a **Warble-Whistle** (3 charges). It can imitate any bird call and can even be used to send simple messages. **Recharge**: Feed a baby bird as its mother would, then blow.
background.beast-handler.table.1.5=**Rodents** — Take a **Pan Flute** that emits a high-pitched sound that only rodents can hear. So long as you play, they will follow, even to their deaths.
background.beast-handler.table.1.6=**Serpents** — Take a **Warming Stone** that generates an irresistible heat and a vial of **Antitoxin** (2 uses).
background.beast-handler.table.2.prompt=What have you learned from the creatures of the wild?
background.beast-handler.table.2.1=That there is far more to the world than meets the eye. With quiet concentration, you can borrow the senses of a nearby creature of your **specialty**.
background.beast-handler.table.2.2=That the behavior of beasts is a language in itself. When observing beasts of your **specialty** you gain insight into weather patterns and impending disasters.
background.beast-handler.table.2.3=That the pulse of the hunt is a powerful impulse. You have a sense for when predators, even those **not of your specialty** are near.
background.beast-handler.table.2.4=That the land is a language unto itself. Your chance of becoming lost in a terrain dominated by the beasts of your **specialty** is reduced by one step (e.g. 4-in-6 becomes 3-in-6).
background.beast-handler.table.2.5=That nature's symphony can be heard if you attune to its rhythm. When surrounded by creatures of your **specialty**, they can alert you to approaching danger before it arrives.
background.beast-handler.table.2.6=That survival is all about adaptability. Once per day, you may take on a simple feature from a creature of your **specialty** (webbed fingers, night vision, etc.). Add a **Fatigue** each time.
background.bonekeeper.table.1.prompt=What did you take from the dead?
background.bonekeeper.table.1.1=A **crow-shaped amulet**. You can ask a question of the dead but must add a **Fatigue** each time. They do not always speak truthfully.
background.bonekeeper.table.1.2=A **mortal wound** from a freed _revenant_. You were healed, but the disfigurement has made you a pariah. You require neither air nor sustenance but are still subject to pain and death. Trapped between worlds, the dead see you as one of their own.
background.bonekeeper.table.1.3=A **Blood Pail** (_bulky_) from a local death-cult. Empty it to raise a servant built from whatever is buried below, with 6 HP, 1 Armor, 13 STR, 11 DEX, 4 WIL, and shard fists (d8+d8). Only one servant can be raised at a time. If destroyed, you permanently lose 1d4 STR. **Recharge**: Fill with the blood of a dying warrior.
background.bonekeeper.table.1.4=A **burial wagon** (+6 slots, _slow_) from your last job. It came with a stubborn old **donkey** (+4 slots, only +2 slots if pulling wagon).
background.bonekeeper.table.1.5=The **Detect Magic** Spellbook, stolen from an ancient library. Your family worked in service to an obscure underworld deity, but you lost your faith. Though exiled, you continue to serve, even as an apostate. Detect Magic: You can see or hear nearby magical auras. _Becomes warm to the touch when magic is used nearby._
background.bonekeeper.table.1.6=A **plague doctor's mask**, after its owner succumbed to the disease that wiped out everyone you once knew. They should have kept it on.
background.bonekeeper.table.2.prompt=What tool was invaluable in your work?
background.bonekeeper.table.2.1=**Manacles** — Though old, it's still effective even against the very strong. You don't have the key.
background.bonekeeper.table.2.2=**Sponge** — Supposedly made from the remains of a rare sea creature. It never seems to dry out.
background.bonekeeper.table.2.3=**Pulley** — Great for moving gravestones, rocks, or even bodies.
background.bonekeeper.table.2.4=**Incense** — Perfect for rituals or to keep the flies at bay. Cools the blood.
background.bonekeeper.table.2.5=**Crowbar** — d6 damage. Sometimes you just need to get the damn thing open!
background.bonekeeper.table.2.6=**Repellent** — Powerful stuff. Its faded label makes it unclear what it is actually _meant_ to repel, though. Perhaps everything. 3 uses.
background.cutpurse.table.1.prompt=What was your last big job?
background.cutpurse.table.1.1=A noble's summer home. The place was full of fancy wine (+20gp) but not much else. Take **Fence Cutters**.
background.cutpurse.table.1.2=A bank. (You were caught.) You bear a brand only visible by firelight, and anyone who sees the mark can ask you for a beer. Take **Retractable Wires**.
background.cutpurse.table.1.3=A guild warehouse. Take a **Ladder** (_bulky_, 10ft) and **Blinding Powder** (1 use).
background.cutpurse.table.1.4=Moneylender. Someone beat you to the job but left behind a **Scroll** of _Arcane Eye_ (_petty_). _Arcane Eye_: You can see through a magical floating eyeball that flies around at your command.
background.cutpurse.table.1.5=Constable's quarters. You escaped but left some friends behind. Take **Strong Silk Rope** (30ft) and a queasy feeling.
background.cutpurse.table.1.6=A university. You were seen but not pursued. You still don't know why. Take **Smoke Pellets** (3 uses).
background.cutpurse.table.2.prompt=What helps you steal?
background.cutpurse.table.2.1=**Catring** — 2 charges. Climb up walls and fall safely. **Recharge**: Place the ring on a stray cat's tail.
background.cutpurse.table.2.2=**Gildfinger** — 1 charge. A finger glove that mimics any mundane key. **Recharge**: Bundle it with at least 100gp for a night.
background.cutpurse.table.2.3=**Glimpse Glass** — 3 uses. A monocle that lets you see through walls or other obstructions. It shatters after the last use.
background.cutpurse.table.2.4=**Sweetwhistle** — 1 charge. Listeners hear a soft, familiar voice in the distance that they cannot resist following. **Recharge**: Lose a dear memory. (Describe it.)
background.cutpurse.table.2.5=**Vagrant's Veil** — 1 charge. Wear it to blend seamlessly into crowds, appearing as a simple pauper. **Recharge**: Donate the day's winnings to the poor. _Petty_
background.cutpurse.table.2.6=**Reverse Teetotum** — 1 use. When spun, time skips backwards 30 seconds. Everyone remembers what happened.
background.fieldwarden.table.1.prompt=What got the better of you?
background.fieldwarden.table.1.1=A voracious swarm of pests that swallowed crops and animals alike. With nothing to defend, you left. Take **Gale Seed Extract** (3 uses).  Ingesting it lets you sprint with a speed four times your regular rate. Afterward you add two **Fatigue**.
background.fieldwarden.table.1.2=A crop spirit, angered by a poor tithing. The fires consumed nearly everything, and afterward you were able to gather a pouch of **Fireseeds** (d8, _blast_, 4 uses).
background.fieldwarden.table.1.3=An antlered, toothy demon that nearly ended you. Take a blood-stained **Bone Knife** (d6). On **Critical Damage**, its next attack becomes _enhanced_ from contact with blood.
background.fieldwarden.table.1.4=_The Withering_, a type of stem rot from the **Roots**. Take a **Diseased Crop** (6 uses) that quickly decays any plant it touches.
background.fieldwarden.table.1.5=Wolves, or so you thought. You are now a **Werewolf** [8 HP, 15 STR, 14 DEX, claws (d6+d6), bite (d8)]. Your WIL remains the same. You can _turn_ at will (once per day) but must make a WIL save to revert. Anyone left alive from your attacks must make a WIL save to avoid infection.
background.fieldwarden.table.1.6=Crop thieves. Not all of them survived, but you were outnumbered. Start with +d4 HP and a **Cusped Falchion** (d8).
background.fieldwarden.table.2.prompt=What tool saved your life?
background.fieldwarden.table.2.1=**Bloodvine Whip** — d8 damage. On **Critical Damage**, it drains the target's blood, granting the weapon's next attack the _blast_ quality
background.fieldwarden.table.2.2=**Clatter Keeper** — A hand-cranked device that emits a loud noise, frightening away most creatures.
background.fieldwarden.table.2.3=**Sun Stick** — Provides ample warmth and light for up to one hour. **Recharge**: Leave in heavy sunlight for a full day. 1 use.
background.fieldwarden.table.2.4=**Root Tether** — When thrown, binds a creature as large as a wolf to the soil for a short time.
background.fieldwarden.table.2.5=**Greenwhistle** — A small flute that calms plants, making passage through areas heavy with plant life a bit easier.
background.fieldwarden.table.2.6=**Everbloom Band** — A circlet adorned with flowers that never wilt. On **Critical Damage**, the flowers dissolve into dust, but you act as if your save succeeded (STR loss still occurs).
background.fletchwind.table.1.prompt=How did you earn your bow?
background.fletchwind.table.1.1=**War**. If you are first to attack, your bow gains the _blast_ property for the first round.
background.fletchwind.table.1.2=**Falconry**. You keep a falcon [3 hp, 5 STR, 16 DEX, 4 WIL, claws (d6+d6), bite (d8)]. It only eats live game.
background.fletchwind.table.1.3=**Hunting**. When taking the Supply action, your ability to secure **Rations** increases by **one step** (e.g. 1d4 becomes 1d6).
background.fletchwind.table.1.4=**Tournaments**. Attacks with your bow are _enhanced_ if the target is immobile.
background.fletchwind.table.1.5=**Training**. If you are the first to attack, melee attacks against you are _impaired_ until you take STR damage.
background.fletchwind.table.1.6=**Scouting**. When taking the Travel action, your presence decreases the chance of getting lost by one step (e.g. 4-in-6 becomes 3-in-6).
background.fletchwind.table.2.prompt=What kind of wood is your bow made from?
background.fletchwind.table.2.1=**Western Yew** (d6, _bulky_). Can be wielded as a blunt weapon (d6). Noisy.
background.fletchwind.table.2.2=**Sessile Oak** (d8, _bulky_). Slams into targets. On **Critical Damage** something is torn off.
background.fletchwind.table.2.3=**Stone Pine** (d6, _bulky_). Produces one use of **Sticky Sap** per day. The sap is highly explosive.
background.fletchwind.table.2.4=**White Ash** (d6, _bulky_). Can be used in place of a shield in melee combat (+1 Armor).
background.fletchwind.table.2.5=**Striped Bamboo** (d6). Collapsible, it only requires one slot (but still requires both hands).
background.fletchwind.table.2.6=**Wych Elm** (d6, _bulky_). Protects the bearer from poisons and toxins, so long as they are holding it.
background.foundling.table.1.prompt=Who took you in?
background.foundling.table.1.1=An old hunter. You were both quite happy, until it all ended. Take a **Weathered Longbow** (d8, _bulky_) and a **Leather Jerkin** (1 Armor).
background.foundling.table.1.2=A wizened apothecary, who taught you the healing arts but maintained a clinical detachment. Take a **Healing Unguent** (restores d4 STR, 1 use).
background.foundling.table.1.3=A druid, who taught you the language of trees. When it came time to , you took with you only a **Gnarled Staff** (d8) and left a promise that one day you would return.
background.foundling.table.1.4=A gruff blacksmith from a sleepy river town. You were always kept at arm's length. Now the forge is cold, and you've moved on. Take a **Smith's Apron** (_petty_) and a set of **Oft-mended Chain Mail** (2 Armor, _bulky_).
background.foundling.table.1.5=A troupe of traveling entertainers. For a time, they were like family to you. One day you woke up and they were gone with no explanation. Take a **Storybook**, a **Dagger** (d6), and some burning questions.
background.foundling.table.1.6=The monks of a secluded forest monastery. When their rules became too strict, and you snuck away. Take a **Monk's Habit** (warm, _petty_) and a **Spellbook** of _Control Plants_. Control Plants: Nearby plants and trees obey you and gain the ability to move at a slow pace. _Leaves grow along the spine, and it smells faintly of decay._
background.foundling.table.2.prompt=What keeps bad tidings at bay?
background.foundling.table.2.1=**Pipeweed** — Your good luck charm. Conversations tend to flow more easily after a smoke. 6 uses.
background.foundling.table.2.2=**Stink Jar** — Shattering this jar releases an odor so foul all nearby must make a STR save or immediately vomit. 1 use.
background.foundling.table.2.3=**Ivy Worm** — A green worm often mistaken for a weed. Swallowed whole, it absorbs any toxins or rot in the body before exiting through the usual way.
background.foundling.table.2.4=**Dream Stone** — A smooth blue stone that helps recall dreams more clearly. Overuse can cause dream-addiction.
background.foundling.table.2.5=**Drowning Rod** — A finger-sized wooden stick that doubles in size each time it is fully submerged in water. It does not shrink down again.
background.foundling.table.2.6=**Rabbit's Foot** — You were wearing it when they found you. They say it is the foot of she who left you and that it protects you from witch magic. _Petty_.
background.fungal-forager.table.1.prompt=What strange fungus did you discover?
background.fungal-forager.table.1.1=**Shrieking Trumpet**. When exposed to light, it screams so loudly that all nearby attacks (including your own) are _impaired_. 2 uses.
background.fungal-forager.table.1.2=**Torch Fungus**. When crushed, it creates a cold blue light for a short while. 2 uses.
background.fungal-forager.table.1.3=**Murderous Truffle**. Pungent, highly toxic, and very rare (worth 50gp to assassins).  Illegal pretty much everywhere. 1 use.
background.fungal-forager.table.1.4=**Hellcap**. Exposure to its aroma causes intense nausea and vomiting. Either way, it clears the room. Bottled (1 use).
background.fungal-forager.table.1.5=**Sproutcup**. Ingest to shrink down to the size of a mouse. (Your belongings stay the same size.) You return to normal size within the hour, often in fits and starts. 1 use.
background.fungal-forager.table.1.6=**Rootflower**. A white fungus found only on corpses deep underground. Ingest to restore d6 WIL. You will dream of the dead and their stories. 1 use.
background.fungal-forager.table.2.prompt=What keeps you sane, even in utter darkness?
background.fungal-forager.table.2.1=**Glowsnail** — Casts a soft, bioluminescent light. Feeds on one ration every two days.
background.fungal-forager.table.2.2=**Silk Moth Shawl** — A weatherproof blanket, it can also douse a fire without being damaged.
background.fungal-forager.table.2.3=**Milkflower** — A gentle stimulant. Chewing it makes you immune to _panic_ for the next hour. 3 uses.
background.fungal-forager.table.2.4=**Luxcompass** — Hums softly as it moves closer to the Sun. Eventually the noise becomes unbearably loud.
background.fungal-forager.table.2.5=**Sloth-Tarp** — A tough and weatherproof fabric, useful for hanging off trees. When inside, you have +1 Armor.
background.fungal-forager.table.2.6=**Miner's Grease** — Great for dislodging a gem, tool, or limb from a tight crack. Highly explosive. 3 uses.
background.greenwise.table.1.prompt=How has the Wood failed you ?
background.greenwise.table.1.1=An ill-tempered forest spirit cursed you for stealing, marking you as an enemy of their kind. Take a **Bezoar Stone**. Ingesting it cures any poison (1 use, unless retrieved).
background.greenwise.table.1.2=A close friend disappeared into the forest. Now you see their face in any tea you brew. Take a **Soporific Concoction** (3 uses).
background.greenwise.table.1.3=You were poisoned, losing your sense of taste and smell. You can now withstand noxious fumes and always carry **Antitoxin** (2 uses).
background.greenwise.table.1.4=Your radical experiments turned your skin green, and you now gain nourishment as a plant. You don't need **Rations**, but a day without sufficient sunlight and water leaves you _deprived_.
background.greenwise.table.1.5=Your impressive corpseflower won a local contest then promptly killed a judge. You fled, but not without the **Prize Money (100gp)** and a warrant for your arrest.
background.greenwise.table.1.6=You created a restorative tincture that also causes accidental infertility. Take a **Healing Potion** that completely restores STR. Only you know of its unintended side-effects.
background.greenwise.table.2.prompt=What keeps you safe while in the Wood?
background.greenwise.table.2.1=**Amadou** — A vermilion fungus that catches fire quite easily. 3 uses.
background.greenwise.table.2.2=**Delphinium** — Breathe water for up to one hour. 1 use, but can be divided into fractional doses.
background.greenwise.table.2.3=**Tacky Stalk** — A woody reed that hardens into a permanent adhesive when chewed. 2 uses.
background.greenwise.table.2.4=**Wisp Lantern** — Caged in wrought iron, provides a dim light so long as the wisp is able to feed on nearby pain and fear.
background.greenwise.table.2.5=**Seed Bomb** — A canvas sack filled with seeds that explode on impact. d6 damage (_blast_, 3 uses).
background.greenwise.table.2.6=**Briarvine** — Entangles any creature up to horse size (STR to break free). Reusable.
background.half-witch.table.1.prompt=What did you bring back from the Unseelie Court?
background.half-witch.table.1.1=A **Black Rose Fiddle** (_bulky_). Its music causes intense sadness and immobility in nearby mortals. (Others are merely fascinated.) You don't know how to play.
background.half-witch.table.1.2=**Paper legs**. You are extremely light, and can fall a few stories without getting hurt. Try to avoid tearing them or getting them wet.
background.half-witch.table.1.3=A **Living Nightmare** that dwells within you but manifests whenever you are in danger. It has your same **Attributes** and **HP** and attacks with claws (d8+d8). It disappears on **Critical Damage** (take 1d4 WIL damage), re-appearing again on the next full moon.
background.half-witch.table.1.4=A **Raven Familiar** [8 HP, 3 STR, 11 DEX, 13 WIL, beak, (d6)]. It speaks as an intelligent being and is entirely devoted to you.
background.half-witch.table.1.5=A **Briar Thorn**. It can pierce any organic material (quite painfully) but when removed leaves no trace of the intrusion.
background.half-witch.table.1.6=A Fae creature's **True Name**. Use it to summon its owner for an act of great service, but only once. It could also fetch a hefty price, from the right buyer.
background.half-witch.table.2.prompt=What concoction do you carry, and what rare ingredients did you gather to make it?
background.half-witch.table.2.1=**Rebirth Ash** — Remnants of a bark spirit. Sprinkle to reignite a fire that has died or return to life a creature that has died only moments before. 3 uses.
background.half-witch.table.2.2=**Glamour Feather** — Plume of a firebird. Can make any creature appear convincingly as someone (or something) else. 1 use.
background.half-witch.table.2.3=**Hawthorn Seed** — An acorn from the other side, gathered on the spring equinox. When planted, it sprouts a luxurious shelter, collapsing at moonrise the next day. 1 use.
background.half-witch.table.2.4=**Stonetree Sap** — Sap obtained in exchange for blood. Hardens when rubbed on any surface (+1 Armor). 3 uses.
background.half-witch.table.2.5=**Nightdust Powder** — Made from the ritual burning of six owls. When tossed in the air, day turns to night for a short while. 2 uses.
background.half-witch.table.2.6=**Hex Stone** — Gathered from a river that flows from the _other side_. Removed from its iron tin, it can absorb the effects of an active magical effect. If destroyed, the magic is released. 1 use.
background.hexenbane.table.1.prompt=To which order do you belong?
background.hexenbane.table.1.1=**Order of the Crossroads**. Take a **Pocket Leyfinder**. It points to nearby ley lines and other sources of arcane power. If you lose it, the punishment is death.
background.hexenbane.table.1.2=**Order of the Bleeding Star**. Take a **Star-Iron Mace** (d8). It shines faintly in darkness and becomes very hot in the presence of witchcraft.
background.hexenbane.table.1.3=**Order of the Glass Sigil**. Take a short sword (d8) and chainmail (2 Armor, _bulky_). You have contacts in most towns (the more rural, the better) willing to provide aid, food, or even weapons.
background.hexenbane.table.1.4=**Order of the Blank Eye**. Take a **Voidglass Shard**. Peer through it to see invisible marks, creatures, and other magical effects. Lose the use of your eye for an hour afterwards (you are _deprived_).
background.hexenbane.table.1.5=**Order of Canaas**. Once per day, you can change into a wolf. Take a **Quicksilver Chain**. Without it, you are unable to shift back.
background.hexenbane.table.1.6=**Order of the Silent Veil**. Take a **Quell Stone** (2 uses) wrapped in burlap. Extinguishes any nearby flames once exposed to air.
background.hexenbane.table.2.prompt=What was your vow?
background.hexenbane.table.2.1=**Honesty**. Choose a **weapon type** (blunt, blade, etc). Attacks against you of this type are _impaired_. If your vow is broken, you lose d4 WIL.
background.hexenbane.table.2.2=**Poverty**. You carry the _Disassemble_ **Spellbook**. Only you can use it. If your vow is broken, it explodes (d12 STR damage). Disassemble: Any of your body parts may be detached and reattached at will, without causing pain or damage. You can still control them. _Regenerates any torn or defaced pages._
background.hexenbane.table.2.3=**Selflessness**. You are immune to **mind-altering magical effects**, such as _charm_, _hatred_, _frenzy_, and so on. If you break this vow, you lose d6 WIL.
background.hexenbane.table.2.4=**Mercy**. Choose a **weapon type** (blunt, blade, etc). Attacks with this weapon are _enhanced_. If your vow is broken, you can never use that weapon type again.
background.hexenbane.table.2.5=**Charity**. Once per day you can shrug off a **Fatigue**. If your vow is ever broken, you permanently lose one inventory slot.
background.hexenbane.table.2.6=**Valor**. The first time you inflict **Critical Damage**, you receive +d4 HP, returning to the previous limit at the end of combat. If your vow is broken, you die.
background.jongleur.table.1.prompt=What happened at your final performance?
background.jongleur.table.1.1=Despite your training in the deadly arts, an actor died and you were blamed. Take a light-weight **Rapier** (d6) and a false identity.
background.jongleur.table.1.2=The crowd loved your catchy tune about a noble and his romantic failings. The noble in question, not so much. Take the _Read Mind_ **Spellbook** and a warrant for your arrest. Read Mind: You can hear the surface thoughts of nearby creatures. _Long-term possession can cause the reader to mistake the thoughts of others as their own._
background.jongleur.table.1.3=Your debut composition reduced the audience to a gibbering mess, murmuring of bright creatures descending from the night sky. Later you noticed that the notes resembled stellar constellations. Take a **Book On Astronomy**, and a lot of questions.
background.jongleur.table.1.4=You mocked a forgotten trickster god and were cursed for it. You speak only in perfect rhyme. Ironically, this has only made you more popular among your peers. Take a **Thesaurus** (20gp). Without it, you are _deprived_.
background.jongleur.table.1.5=You were scarred in an on-stage accident. The crowd cheered, thinking it was part of the act. Take well-worn **Stage Mail** (1 Armor), a memorable scar, and a fear of applause.
background.jongleur.table.1.6=Your respectable puppeteering skills were matched only by your mimicry. You were so good you were branded a witch (literally) and banished. Take an **Uncanny Hand-Puppet** and a **Rabbit Skull** (_petty_) that protects against charms.
background.jongleur.table.2.prompt=What trinket were you unable to leave behind?
background.jongleur.table.2.1=**False Cuffs** — Comfortable, realistic-looking cuffs. Only you know the trick to get out of them.
background.jongleur.table.2.2=**Pocket Theatre** — A set of small puppets and a folding stage. Good for quick distractions.
background.jongleur.table.2.3=**Ghost Violin** — A dark-gray violin that plays a haunting tune, mirrored by an invisible, distant twin.
background.jongleur.table.2.4=**Tragic Tales** — Banned in proper company, this book becomes less bawdy and more harrowing towards the end. Worth **100gp**.
background.jongleur.table.2.5=**Mythos Mask** — A plaster mask that allows one to take on a monster's countenance. Once it comes off, add a **Fatigue**.
background.jongleur.table.2.6=**Rebreak Glass** — A wine flute that can be broken multiple times, reforming after 24 hours. Makes a really loud noise.
background.kettlewright.table.1.prompt=What is your trade?
background.kettlewright.table.1.1=You build small contraptions for local guilds (and don't ask too many questions). Take an extra 40gp and a wanted poster with your face on it. Given time and materials, you can open almost any door or vault.
background.kettlewright.table.1.2=You deal in home goods and tools, hawking your wares to townspeople across the lands. Take 20gp worth of items from the [gear](/second-edition/players-guide/marketplace#gear) table. You are fluent in the _Traveler's Cant_.
background.kettlewright.table.1.3=You were a military smelter, before peace destroyed your livelihood. Take a **smelting hammer** (d10, _bulky_) and a **tin helm** (+1 Armor). Given time and adequate materials, you can repair armor.
background.kettlewright.table.1.4=You sell rare and quality items to monasteries and nobles alike. Take a **Spyglass**, a **Necklace** (_petty_) worth 20gp, and a **Scroll** of Mirrorwalk (_petty_).
background.kettlewright.table.1.5=You offer protection as a service, quietly watching for threats as money exchanges hands. You start with **+d4 HP**, and carry a **Long Sword** (d10, _bulky_) and a **Gambeson** (+1 Armor).
background.kettlewright.table.1.6=You scavenge raw tin and iron from battlefields, pulling teeth from still-twitching corpses. Start with a young **Donkey** (+4 slots, slow), a **Crossbow** (d8 damage, _bulky_), and a **Saw** (d6).
background.kettlewright.table.2.prompt=What never fails to get you out of trouble?
background.kettlewright.table.2.1=**Fire Eggs** — Six small pellets made of sea salt, wood, and crockery-dust. They explode at low heat (d8, _blast_) but the flames dissipate quickly.
background.kettlewright.table.2.2=**Black Tar** — Versatile: both sticky and highly flammable. 3 uses.
background.kettlewright.table.2.3=**Spiked Boots** — Cracks heads (d8) as easily as it does ice and muck. Travel is also a bit slower, but easier.
background.kettlewright.table.2.4=**Tinker's Paste** — Seals shut any fist-sized opening. 3 uses.
background.kettlewright.table.2.5=**Fireworks** — A dazzling albeit dangerous display. Enough explosive material to blow off a finger or three. 2 uses remain.
background.kettlewright.table.2.6=**Carrion Cat** — A clever pet, small enough to hide in your pack (_bulky_), but strong enough to scare off smaller predators. Requires one **Ration** a day, and it must be meat.
background.marchguard.table.1.prompt=Why did you take the Oath?
background.marchguard.table.1.1=Your family has a long tradition of serving, and you were trained from an early age on how to survive in the wild. When taking the Supply action, your yield increases by one step (e.g. 1d4 > 1d6).
background.marchguard.table.1.2=As a convict, the Oath was simply a means of avoiding punishment. Take a set of **Lockpicks** and the **Key** (_petty_) to a safehouse.
background.marchguard.table.1.3=Noble-born, you joined to escape family trouble. Take a **Goosefelt Tarp** (fits two) that you stole before leaving home.
background.marchguard.table.1.4=When your family lost everything, you took the Oath to avoid becoming a burden. Take extra **Rations** (3 uses) and a brace of **Throwing Knives** (d6).
background.marchguard.table.1.5=Your life was saved by a member of the **Marchguard**, and you were inspired to join their ranks. Take a **Snare Trap** and a **Sketchbook** filled with detailed drawings.
background.marchguard.table.1.6=You were in a dark place and decided that your life needed a little direction. You're still not so sure it was the right choice. Take an **Oilskin Coat** and **Mapping Paper**.
background.marchguard.table.2.prompt=What do you carry as proof of your Oath?
background.marchguard.table.2.1=**Impressive Pin** — A metal badge of honor from the Guard. It can open doors but leaves a trail. _Petty_.
background.marchguard.table.2.2=**Oath Compass** — Points not towards North, but instead to the nearest member of the Guard. It also lets you know when they're getting close.
background.marchguard.table.2.3=**Pullstones** — Two jet-black stones. When separated, the stones will always roll toward one another.
background.marchguard.table.2.4=**Fireflask** — Highly alcoholic, yet strangely delicious. When thrown, it creates a wall of flames 10ft high that burns out after a few minutes. 1 use.
background.marchguard.table.2.5=**Pain Band** — Touch an injured creature to transfer their wounds to you. (Exchange their lost STR with your own.) **Recharge**: Wear the ring while in perfect health. You will lose 1 STR, permanently. _Petty_.
background.marchguard.table.2.6=**Poacher's Woe** — Strongly-scented arrows (3 uses). The scent is powerful enough to track with ease.
background.mountebank.table.1.prompt=How was your fraud exposed?
background.mountebank.table.1.1=Your "patients" kept reporting miraculous recoveries, despite your lack of training. Start with **Bandages** (3 uses) and a knack for healing.
background.mountebank.table.1.2=After seducing a wealthy patron, their family hired a criminal gang to retrieve you. You got away and need to lay low. Start with **Beauty Cream**, 2 uses. Apply to appear irresistibly beautiful for the next 12 hours.
background.mountebank.table.1.3=You were a peddler of fake prophesies, but when one turned out to be true, it drew unwanted attention. Roll on the **Omens** table, but keep the result to yourself. Start with a concealable **Knife** (d6, _petty_).
background.mountebank.table.1.4=Your latest stunt destroyed a priceless artifact and injured a dozen bystanders. Start with a **Captain's Uniform** (_petty_), a **Ceremonial Sword** (harmless, 60gp), and a **Bouquet of Flowers**.
background.mountebank.table.1.5=You were cursed by a hedgewitch for fooling some innocent village folk. Magic acts unpredictably in your hands (_WIL save to avoid disaster_). If you are the target of magic, the same applies to its wielder.
background.mountebank.table.1.6=Your "seances" with the dead were in actuality a ruse involving a cleverly hidden spellbook of Auditory Illusion. Inevitably, a patron discovered your secret. Start with the **Spellbook** and a bundle of scarves. Auditory Illusion: You create illusory sounds that seem to come from a direction of your choice. _Produces random and occasionally inopportune sounds throughout the day_.
background.mountebank.table.2.prompt=What keepsake could always identify you?
background.mountebank.table.2.1=**Royal Crest** — Born into royalty, you chose a different life. The crest grants you access but also alerts your family of your whereabouts. _Petty_.
background.mountebank.table.2.2=**Miracle Oil** — A smelly, slippery concoction. 2 uses.
background.mountebank.table.2.3=**Surgeon's Soap** — A lye and ash block that makes skin temporarily transparent, revealing the anatomy within. 4 uses.
background.mountebank.table.2.4=**Goat Powder** — Derived from the placenta of a baby goat.  Temporarily cures any affliction, but symptoms return within hours.
background.mountebank.table.2.5=**Cursed Sapphire** — Worth **200gp**, it noticeably returns to your pocket shortly after you spend it. You can't seem to get rid of it.
background.mountebank.table.2.6=**Alchemical Tattoo** — A dog, cat, or bird that can leave your body on demand. It follows your commands to the best of its abilities and can pass its injuries (_as STR loss_) back onto you. _Petty_.
background.outrider.table.1.prompt=What personal code or principle do you uphold?
background.outrider.table.1.1=**No innocent blood**: No bystander will come to harm on your watch. Take a **Steadymade Buckler** (+1 Armor). While holding this shield, you cannot be moved so long as both feet are planted on firm ground.
background.outrider.table.1.2=**Revere the tools of death**: Weapons are to be respected and maintained. Take a **Wyrmbone Whetstone**. Following a half-hour ritual sharpening, attacks with the weapon are _enhanced_ until STR damage is dealt.
background.outrider.table.1.3=**To the death, always**: You never back down from a fight, no matter the odds. Take a **Death-Whistle**, 1 charge. Its scream frightens away all who hear it (save WIL or flee). **Recharge**: Capture the final breath of a dying warrior.
background.outrider.table.1.4=**Revere the dead**: Death is a journey we all take, and it deserves respect. Take an extra **30gp**. You always place two gold pieces on the eyelids of a slain foe. Somehow, you always find the coin.
background.outrider.table.1.5=**Loyalty to the work**: Your word is your bond. Once you've accepted a job, you see it through to the end. Take a weathered **Tally Stick**. Once a vow is marked onto its face, the stick hardens (d8) until it is complete. The stick will snap in half if the vow is ever broken.
background.outrider.table.1.6=**Always pay your debts**: You always repay what you owe, whether in coin or in kind. You expect nothing less from all others. Take a **Blacked-Out Ledger**, then roll a second time on the **Bonds** table.
background.outrider.table.2.prompt=What breed is your horse?
background.outrider.table.2.1=**Heavy Destrier** — A beast built for war, an imposing creature. 8 HP, 1 Armor, hooves (d10+d10), +2 slots.
background.outrider.table.2.2=**Blacklegged Dandy** — Hardy and adaptable. **Tough** or **Perilous** terrain are one step easier. 6 HP. +4 slots.
background.outrider.table.2.3=**Rivertooth** — Impressively strong, capable of carrying heavy loads. 4 HP. +6 slots (only +2 slots if carrying two people).
background.outrider.table.2.4=**Piebald Cob** — Intelligent, it can understand simple commands and even has an instinct for danger. 6 HP. +4 slots.
background.outrider.table.2.5=**Linden White** — Highly trained and agile, it can perform intricate maneuvers in a time of need (no DEX save to flee). 4 HP. +3 slots.
background.outrider.table.2.6=**Stray Fogger** — Wild but very fast (even in **Tough** terrain). Rides light. 4 HP. +2 slots.
background.prowler.table.1.prompt=What did you last hunt?
background.prowler.table.1.1=A _mock firefly_, baiting water carriers with its glowing lure. Take an **Alchemical Limb** (d8, _petty_ when worn) to replace the one it tore off and an **Oil Can** (6 uses). The limb is immune to heat and poison. Needs to be oiled daily.
background.prowler.table.1.2=An _ice nettle_, trapping and draining sheep. You lost your commission when the fungus you introduced killed half the flock. Take a **Rime Seed** (1 use). It freezes any body of water, no matter the size. Don't eat it.
background.prowler.table.1.3=A _silver marsh crawler_ that killed someone close to you. You now carry its **Tooth** (_petty_) on a chain around your neck as a warning to others of its kind. _The tooth hums softly when something is stalking you_.
background.prowler.table.1.4=A malicious _forest spirit_ that poisoned a homestead. You saved a **Heartseed** from the roots of a dying tree. (Plant it to create a new forest.) Also, take **Iron Bracers** (+1 Armor, _bulky_).
background.prowler.table.1.5=A _hollow wolf_ that had been frightening travelers. You took pity on the half-starved creature and nursed it back to health. Now it is loyal to you unto death. It is also a great tunneler. 5 HP, 11 STR, 13 DEX, 8 WIL, teeth (d6).
background.prowler.table.1.6=An _azure warbler_. The gametes attract a sizeable profit, if properly extracted. You succeeded but left its nest to the wolves. Take a **Paring Knife** (d6), **an extra 20gp**, and a pang of regret.
background.prowler.table.2.prompt=What tool is always in your pack?
background.prowler.table.2.1=**Fermented Spirits** — Keeps you warm at the best of times and as an explosive at the worst. 3 Uses.
background.prowler.table.2.2=**Trail Shaker** — A noisy instrument that reveals nearby trails, even when deeply hidden.
background.prowler.table.2.3=**Drowse Balm** — A wax bar. If boiled in water, the steam acts as a soporific agent.
background.prowler.table.2.4=**Spike and Cord** — For traversing difficult terrain or for creating makeshift traps and structures.
background.prowler.table.2.5=**Iron Rattle** — A noisemaker for distracting or scaring your quarry. Sounds convincingly like a snake.
background.prowler.table.2.6=**Hardening Glue** — Makes any flat material (cloth, leather, sand) as hard as stone. Expensive (20gp a bottle, 3 uses).
background.rill-runner.table.1.prompt=What songs are you best known for?
background.rill-runner.table.1.1=_The Tinker's Two-Step_. A humorous fairy tale about a gift-giving traveler. Start with a **Reed Whistle**. Anyone in earshot must pass a WIL save to perform an act of violence.
background.rill-runner.table.1.2=_The Sylph and Her Lover_. A bawdy tale of lost love. Start with a **Breeze Knot** (3 charges). Creates a strong breeze. **Recharge**: Tie it to a mast during a storm.
background.rill-runner.table.1.3=_Harper's Devotion_. A sad, short tale about a musician that falls in love with a star. Start with a **Celestial Lute**. Reveals the constellations above, no matter the weather.
background.rill-runner.table.1.4=_The Reed Fisher_. A celebrated song about a massive carp that always seems to get away. Begin with a spool of **River Twine** (5 uses). Each dip into the river guarantees a catch, though it might not be pleasant.
background.rill-runner.table.1.5=_Song of the Silver Stream_. A wordless lullaby that mimics flowing water. Take a **Stone Flute** that can calm almost any river.
background.rill-runner.table.1.6=_The Thrush and the Meadow_. A moody tale told in alternating chorus. Start with a **Feather Quill** (1 use, _petty_). A map drawn with this quill reveals the most expedient course between any two points.
background.rill-runner.table.2.prompt=What pays your way across the land?
background.rill-runner.table.2.1=**Performance** — Performing at taverns always yields both room and board. Sometimes you even get tips! Start with an extra **10gp**.
background.rill-runner.table.2.2=**Bodyguard** — You are a protector for those afraid to travel alone. Start with a **Rapier** (d8).
background.rill-runner.table.2.3=**Wares** — You buy low and sell high, always making just enough to get by. Take a **single item** worth **20gp** (or less) from the [gear](/second-edition/players-guide/marketplace#gear) table.
background.rill-runner.table.2.4=**Transport** — You deliver "delicate" packages throughout the lands. You have at least one contact in any major town.
background.rill-runner.table.2.5=**Sailor's Friend** — Over troubled waters and dangerous winds, you always make sure a ship reaches its destination. For you, passage is always free.
background.rill-runner.table.2.6=**Guide** — You shepherd caravans and travelers across water-soaked lands. Start a **map** (_petty_) relevant to your next journey.
background.scrivener.table.1.prompt=What work did you keep for yourself?
background.scrivener.table.1.1=**The Wild Tongue**. A bundle of leather-bound scrolls. A seminal work, cataloging the hidden languages of beasts and how to understand them.
background.scrivener.table.1.2=**The Silent Symphony**. Bound in fluorescent wrap. Very rare, it chronicles the subtle signs used by those employing invisibility magic.
background.scrivener.table.1.3=**A Treatise on the Abyss**. A nondescript black book. An in-depth, largely theoretical text describing the **Roots**, as well as information about the location of a nearby **Gate**.
background.scrivener.table.1.4=**The Star Waltz**. A comet-shaped clasp bound in a fine leather cover. Detailed astronomical charts, celestial movements, and stellar festivals. Highly valued (100gp) for its usefulness to travelers.
background.scrivener.table.1.5=**The Cathedral and the Canopy**. Large-leaf binding over vellum. Nominally a children's storybook, the margins detail information about traveling, eating, and sleeping in the cloud forests.
background.scrivener.table.1.6=**Garden of Glass**. Bound in the cover of another book. A heretical work, it describes the materials, procedures, and optimal locations required to open a **Gate**.
background.scrivener.table.2.prompt=How do you transcribe sensitive information?
background.scrivener.table.2.1=**Fib Ink** — Glows when used to write true statements but fades if used to write false ones.
background.scrivener.table.2.2=**Cipher Stone** — A pair of sharp black stones. Each one decrypts any message written by the other.
background.scrivener.table.2.3=**Everquill** — A quill that writes on any surface. You still need ink. _Petty_.
background.scrivener.table.2.4=**Whisper Vial** — Whisper a message into the vial, and it will play it back to whoever opens it next.
background.scrivener.table.2.5=**Sanguine Lens** — Extracts blood from a target without their knowledge. A stolen drop placed on the eye reveals memories from the past day.
background.scrivener.table.2.6=**Echo Leaf** — A blank parchment. Whomever unfurls it sees their actions of the day slowly revealed in a tight scrawl. _Petty_.
