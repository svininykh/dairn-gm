background.outrider.table.1.prompt=What personal code or principle do you uphold?
background.outrider.table.1.1=**No innocent blood**: No bystander will come to harm on your watch. Take a **Steadymade Buckler** (+1 Armor). While holding this shield, you cannot be moved so long as both feet are planted on firm ground.
background.outrider.table.1.2=**Revere the tools of death**: Weapons are to be respected and maintained. Take a **Wyrmbone Whetstone**. Following a half-hour ritual sharpening, attacks with the weapon are _enhanced_ until STR damage is dealt.
background.outrider.table.1.3=**To the death, always**: You never back down from a fight, no matter the odds. Take a **Death-Whistle**, 1 charge. Its scream frightens away all who hear it (save WIL or flee). **Recharge**: Capture the final breath of a dying warrior.
background.outrider.table.1.4=**Revere the dead**: Death is a journey we all take, and it deserves respect. Take an extra **30gp**. You always place two gold pieces on the eyelids of a slain foe. Somehow, you always find the coin.
background.outrider.table.1.5=**Loyalty to the work**: Your word is your bond. Once you've accepted a job, you see it through to the end. Take a weathered **Tally Stick**. Once a vow is marked onto its face, the stick hardens (d8) until it is complete. The stick will snap in half if the vow is ever broken.
background.outrider.table.1.6=**Always pay your debts**: You always repay what you owe, whether in coin or in kind. You expect nothing less from all others. Take a **Blacked-Out Ledger**, then roll a second time on the **Bonds** table.
background.outrider.table.2.prompt=What breed is your horse?
background.outrider.table.2.1=**Heavy Destrier** — A beast built for war, an imposing creature. 8 HP, 1 Armor, hooves (d10+d10), +2 slots.
background.outrider.table.2.2=**Blacklegged Dandy** — Hardy and adaptable. **Tough** or **Perilous** terrain are one step easier. 6 HP. +4 slots.
background.outrider.table.2.3=**Rivertooth** — Impressively strong, capable of carrying heavy loads. 4 HP. +6 slots (only +2 slots if carrying two people).
background.outrider.table.2.4=**Piebald Cob** — Intelligent, it can understand simple commands and even has an instinct for danger. 6 HP. +4 slots.
background.outrider.table.2.5=**Linden White** — Highly trained and agile, it can perform intricate maneuvers in a time of need (no DEX save to flee). 4 HP. +3 slots.
background.outrider.table.2.6=**Stray Fogger** — Wild but very fast (even in **Tough** terrain). Rides light. 4 HP. +2 slots.
