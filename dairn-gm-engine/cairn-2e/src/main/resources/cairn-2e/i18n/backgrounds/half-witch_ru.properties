background.half-witch.gear.5=Книга заклинания «Заросли»: внезапно вырастает чаща из деревьев и густого кустарника шириной до 50 фт. Увита лозами, которые необходимо разрушать при каждом использовании заклинания.
background.half-witch.gear.6=Маскировочный костюм
background.half-witch.table.1.prompt=Что вам досталось от Незримого двора?
background.half-witch.table.1.1=**Скрипка из черной розы** (_громоздкий_). Ее музыка вызывает у смертных сильную печаль и обездвиживает их. На иных она производит лишь завораживающий эффект. Вы не умеете играть на скрипке.
background.half-witch.table.1.2=**Бумажные ноги**. Вы чрезвычайно легки и можете падать с высоты нескольких этажей без травм. Постарайтесь не намочить их и не порвать.
background.half-witch.table.1.3=**Кошмарное существо**, обитающее внутри вас и проявляющееся, когда вы в опасности. Оно обладает такими же Характеристиками и Очками Защиты, как и вы, и атакует когтями (к8+к8). Исчезает при получении **Критического Урона** (вы теряете 1к4 ВОЛ), и появляется вновь на следующее полнолуние.
background.half-witch.table.1.4=Ворон-фамильяр. Он говорит как разумное существо и полностью предан вам. [8 ОЗ, 3 СИЛ, 11 ЛОВ, 13 ВОЛ, клюв (к6 урон)]
background.half-witch.table.1.5=**Шип шиповника**. Он может проколоть любой органический материал (довольно болезненно), но при извлечении не оставляет следов.
background.half-witch.table.1.6=**Истинное имя феи**. Используйте его, чтобы призвать владельца для выполнения значимой услуги, но только один раз. Также может быть продано за значительную сумму подходящему покупателю.
background.half-witch.table.2.prompt=Какую алхимическую смесь вы носите с собой и какие редкие ингредиенты вы собрали для ее изготовления?
background.half-witch.table.2.1=**Пепел возрождения** — Останки берестяного духа. Развейте над целью, чтобы вновь зажечь потухший огонь или вернуть к жизни существо, умершее мгновение назад (3 использования).
background.half-witch.table.2.2=**Гламурное перо** — Перо жар-птицы. Может заставить любое существо выглядеть как кто-то (или что-то) другое (1 использование).
background.half-witch.table.2.3=**Семя из иного мира** — Желудь из иного мира, собранный в день весеннего равноденствия. При посадке, вырастает в роскошное укрытие, которое исчезает на закате следующего дня (1 использование).
background.half-witch.table.2.4=**Сок камнедрева** — Получен в обмен на кровь. Затвердевает при нанесении на любую поверхность (+1 к броне, 3 использования).
background.half-witch.table.2.5=**Порошок ночной пыли** — Изготовлен путем ритуального сжигания шести сов. При распылении в воздухе, на короткое время превращает день в ночь (2 использования).
background.half-witch.table.2.6=**Шестигранный камень** — Собран из реки, текущей из _иного мира_. Вынутый из железной коробочки, он может поглотить эффект заклинания. При разрушении камня магия освобождается (1 использование).
