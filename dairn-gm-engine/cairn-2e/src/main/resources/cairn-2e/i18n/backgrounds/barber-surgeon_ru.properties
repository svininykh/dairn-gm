background.barber-surgeon.table.1.prompt=Как вы «усовершенствовали» себя?
background.barber-surgeon.table.1.1=Ваш искусственный _глаз_ позволяет рассматривать предметы, как в телескоп, и минимально ориентироваться в темноте. Однако вы не можете надевать на голову металлические предметы, а сильные магниты приводят вас к _истощению_.
background.barber-surgeon.table.1.2=Одна из ваших **ног** почти полностью металлическая (пинок наносит 1к6), что позволяет вам считать некоторые типы труднопроходимой местности как **Легкая**. У вас при себе **Масленка** (6 использований); без ежедневного смазывания вы становитесь _истощенным_ и издаете скрип при движении.
background.barber-surgeon.table.1.3=Кость одного из ваших пальцев заменена протезом из золота и железа. У вас есть **Крюк** и **Отвертка**, которые можно закрепить на кончике пальца.
background.barber-surgeon.table.1.4=Ваши **Уши** хирургически модифицированы, что значительно утончает ваш слух. Вы можете сосредоточиться на определенном звуке, например, разговоре на большом расстоянии. Вы носите ушные накладки для защиты от внезапных громких звуков  (успешный спасбросок ВОЛ позволяет избежать временного паралича).
background.barber-surgeon.table.1.5=Ваша **грудь** покрыта алхимическими символами, делающими кожу более _прочной_ (Броня +1). При этом ношение металлической брони нейтрализует этот эффект.
background.barber-surgeon.table.1.6=Одна из ваших **рук** полностью металлическая и может отсоединяться от плеча. Ее можно использовать как оружие (d8; _громоздкий_, когда не прикреплена) и она способна двигаться самостоятельно, если вы находитесь в пределах видимости.
background.barber-surgeon.table.2.prompt=Какой редкий инструмент незаменим в вашей работе?
background.barber-surgeon.table.2.1=**Мазь регенерации** — Восстанавливает утраченную часть тела в течение дня (1 использование).
background.barber-surgeon.table.2.2=**Приращивающий червь** — Маленький червь, способный сращивать неодушевленные объекты с частями тела (1 использование).
background.barber-surgeon.table.2.3=**Воск для ран** — Заживляет раны от огня или химических ожогов, полностью восстанавливая СИЛ, но не лечит другие повреждения (2 использования).
background.barber-surgeon.table.2.4=**Ртуть** — Стимулятор, позволяющий действовать первым в бою и автоматически проходить спасброски ВОЛ в течение одного часа. Вызывает зависимость: через 24 часа без применения, пройдите спасбросок СИЛ, иначе станете истощенным (4 использования).
background.barber-surgeon.table.2.5=**Пневматический насос** — Портативные железные легкие (_громоздкий_), позволяющие проводить операции или дышать под водой.
background.barber-surgeon.table.2.6=**Магнитный камень** — Вытягивает опасные элементы из тела и действует как мощный магнит.
