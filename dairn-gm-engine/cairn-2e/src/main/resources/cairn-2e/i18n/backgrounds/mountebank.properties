background.mountebank.table.1.prompt=How was your fraud exposed?
background.mountebank.table.1.1=Your "patients" kept reporting miraculous recoveries, despite your lack of training. Start with **Bandages** (3 uses) and a knack for healing.
background.mountebank.table.1.2=After seducing a wealthy patron, their family hired a criminal gang to retrieve you. You got away and need to lay low. Start with **Beauty Cream**, 2 uses. Apply to appear irresistibly beautiful for the next 12 hours.
background.mountebank.table.1.3=You were a peddler of fake prophesies, but when one turned out to be true, it drew unwanted attention. Roll on the **Omens** table, but keep the result to yourself. Start with a concealable **Knife** (d6, _petty_).
background.mountebank.table.1.4=Your latest stunt destroyed a priceless artifact and injured a dozen bystanders. Start with a **Captain's Uniform** (_petty_), a **Ceremonial Sword** (harmless, 60gp), and a **Bouquet of Flowers**.
background.mountebank.table.1.5=You were cursed by a hedgewitch for fooling some innocent village folk. Magic acts unpredictably in your hands (_WIL save to avoid disaster_). If you are the target of magic, the same applies to its wielder.
background.mountebank.table.1.6=Your "seances" with the dead were in actuality a ruse involving a cleverly hidden spellbook of Auditory Illusion. Inevitably, a patron discovered your secret. Start with the **Spellbook** and a bundle of scarves. Auditory Illusion: You create illusory sounds that seem to come from a direction of your choice. _Produces random and occasionally inopportune sounds throughout the day_.
background.mountebank.table.2.prompt=What keepsake could always identify you?
background.mountebank.table.2.1=**Royal Crest** — Born into royalty, you chose a different life. The crest grants you access but also alerts your family of your whereabouts. _Petty_.
background.mountebank.table.2.2=**Miracle Oil** — A smelly, slippery concoction. 2 uses.
background.mountebank.table.2.3=**Surgeon's Soap** — A lye and ash block that makes skin temporarily transparent, revealing the anatomy within. 4 uses.
background.mountebank.table.2.4=**Goat Powder** — Derived from the placenta of a baby goat.  Temporarily cures any affliction, but symptoms return within hours.
background.mountebank.table.2.5=**Cursed Sapphire** — Worth **200gp**, it noticeably returns to your pocket shortly after you spend it. You can't seem to get rid of it.
background.mountebank.table.2.6=**Alchemical Tattoo** — A dog, cat, or bird that can leave your body on demand. It follows your commands to the best of its abilities and can pass its injuries (_as STR loss_) back onto you. _Petty_.
