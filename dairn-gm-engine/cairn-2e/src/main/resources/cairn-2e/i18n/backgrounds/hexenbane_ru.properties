background.hexenbane.table.1.prompt=К какому ордену вы принадлежите?
background.hexenbane.table.1.1=**Орден Перекрестков**. Возьмите **Карманный лейфайндер**. Он указывает на ближайшие лей линии и другие источники магической силы. Если вы его потеряете, наказанием будет смерть.
background.hexenbane.table.1.2=**Орден Кровоточащей Звезды**. Возьмите **Булаву** из **Звездного железа** (к8). Она слабо светится в темноте и становится очень горячей в присутствии ведьмовства.
background.hexenbane.table.1.3=**Орден Стеклянного Символа**. Возьмите **Короткий меч** (к8) и **Кольчугу** (Броня +2, _громоздкий_). У вас есть контакты в большинстве поселений, готовые предоставить помощь, еду и даже оружие.
background.hexenbane.table.1.4=**Орден Пустого Ока**. Возьмите **осколок пустотного стекла**. Загляните в него, чтобы увидеть невидимые метки, существ и другие магические эффекты. После использования один ваш глаз теряет зрение на один час и вы получаете _истощение_.
background.hexenbane.table.1.5=**Орден Канааса**. Один раз в день вы можете превращаться в волка. Возьмите **Ртутную цепь**. Без нее вам не обернуться обратно.
background.hexenbane.table.1.6=**Орден Безмолвной Вуали**. Возьмите **Камень подавления**, завернутый в мешковину. Гасит любые огни поблизости при контакте с воздухом (2 использования).
background.hexenbane.table.2.prompt=Каков был ваш обет?
background.hexenbane.table.2.1=**Честность** — Выберите **тип оружия** (дробящее, колющее и т.д.). Атаки против вас этим типом оружия _ослаблены_. Если вы нарушите обет, то потеряете 1к4 ВОЛ.
background.hexenbane.table.2.2=**Бедность** — У вас есть **Книга заклинания** «Разборка». Только вы можете ее использовать. Если вы нарушите обет, она взорвется, нанеся 1к12 урона СИЛ.Разборка: любая часть вашего тела может быть отсоединена и присоединена по желанию, без боли или повреждений. Вы все еще можете их контролировать. _Восстанавливает любые порванные или поврежденные страницы._
background.hexenbane.table.2.3=**Альтруизм** — Вы невосприимчивы к магическим эффектам, таким как очарование, ненависть, безумие и т.д. Если вы нарушите этот обет, то потеряете 1к6 ВОЛ.
background.hexenbane.table.2.4=**Милосердие** — Выберите **тип оружия** (дробящее, колющее и т.д.). Атаки этим оружием получают _усиление_. Если вы нарушите обет, то больше никогда не сможете использовать этот тип оружия.
background.hexenbane.table.2.5=**Щедрость** — Один раз в день вы можете снять одну **Усталость**. Если вы нарушите обет, то навсегда потеряете один слот инвентаря.
background.hexenbane.table.2.6=**Доблесть** — В первый раз, нанеся **Критический Урон**, вы получаете +1к4 к ОЗ, возвращаясь к прежнему лимиту в конце боя. Если вы нарушите обет, то умрете.
