background.prowler.table.1.prompt=На кого вы охотились в последний раз?
background.prowler.table.1.1=**Светлячок-Иммитатор**, приманивающее рыбаков своим мерцанием.  Вы потеряли конечность в схватке с ним и заменили ее на алхимический протез (к8, _мелкое_ при ношении). Протез устойчив к нагреву и ядам, но требует ежедневной смазки. В комплекте — **Масленка** (6 использований).
background.prowler.table.1.2=**Ледяная крапива**, хватающая и выпивающая кровь овец.  Вы потеряли свою награду, когда распыленный вами грибок уничтожил половину стада. Но теперь у вас есть **Семя ледяной крапивы**, которое замораживает любой водоем независимо от размера. Не употребляйте его внутрь (1 использование).
background.prowler.table.1.3=**Серебряный болотный ползун**, убивший кого-то из ваших близких. Теперь вы носите его **Зуб** (мелкий) на цепочке вокруг шеи как предупреждение для его сородичей. _Зуб мягко гудит, когда за вами кто-то следит_.
background.prowler.table.1.4=**Обозленный лесной дух**, отравивший усадьбу. Вы спасли **сердечное семя** из корней умирающего дерева. Посадите его, чтобы вырастить новый лес. Также у вас есть **Железные наручи** (Броня +1, _громоздкий_).
background.prowler.table.1.5=**Пустотелый волк**, нападавший на путников. Вы сжалились и выходили это изголодавшее существо. Теперь он предан вам до смерти, а еще он отлично роет туннели. [5 ОЗ, 11 СИЛ, 13 ЛОВ, 8 ВОЛ, зубы (к6)].
background.prowler.table.1.6=**Лазурная камышовка**. Ее гаметы при правильном извлечении приносят огромную прибыль. Вы преуспели, но оставили гнездо на съедение волкам. У вас есть **Разделочный нож** (к6), дополнительные **20 зм** и чувством вины.
background.prowler.table.2.prompt=Какой инструмент всегда в вашем рюкзаке?
background.prowler.table.2.1=**Забродивший спирт** — Согревает в лучшие времена и может стать взрывчаткой в худшие (3 использования).
background.prowler.table.2.2=**Следоискатель** — Шумный инструмент, выявляющий поблизости тропы, даже глубоко скрытые.
background.prowler.table.2.3=**Успокаивающий бальзам** — Восковой брусок. Если прокипятить в воде, пар действует как снотворное средство.
background.prowler.table.2.4=**Клин и кабель** — Для преодоления сложной местности или создания самодельных ловушек и сооружений.
background.prowler.table.2.5=**Железная погремушка** — Шумелка для отвлечения или отпугивания добычи. Звучит убедительно, как змея.
background.prowler.table.2.6=**Затвердевающий клей** — Делает любой плоский материал (ткань, кожу, песок) твердым как камень. Дорогостоящий (20 зм за бутылку, 3 использования).
