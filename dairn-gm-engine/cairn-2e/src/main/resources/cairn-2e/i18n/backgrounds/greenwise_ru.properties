background.greenwise.table.1.prompt=Как Лес подвел вас?
background.greenwise.table.1.1=Раздосадованный дух леса проклял вас за воровство, пометив как врага. Возьмите **Камень безоара**. Прием внутрь излечивает от любого яда (1 использование, если камень не извлечен).
background.greenwise.table.1.2=Ваш близкий друг исчез в лесу. Теперь вы видите его лицо в любом заваренном чае. Возьмите **Усыпляющий отвар** (3 использования).
background.greenwise.table.1.3=Вы были отравлены, потеряли вкус и обоняние. Теперь вы можете выдерживать ядовитые пары и всегда носите с собой **Противоядие** (2 использования).
background.greenwise.table.1.4=Ваши радикальные эксперименты окрасили вашу кожу в зеленый цвет, и теперь вы питаетесь как растение. Вам не нужен **Пайок**, но день без достаточного количества солнца и воды делает вас _истощенным_.
background.greenwise.table.1.5=Ваше впечатляющее хищное растение выиграло местный конкурс, но затем убило одного из судей. Вы сбежали, прихватив **Призовые деньги (100 зм)** и став разыскиваемой персоной.
background.greenwise.table.1.6=Вы создали восстанавливающую настойку, которая с некоторым шансом способна привести к бесплодию. Возьмите **Лечебное зелье**, полностью восстанавливающее СИЛ. Только вы знаете о его побочном эффекте.
background.greenwise.table.2.prompt=Что защищает вас в Лесу?
background.greenwise.table.2.1=**Трутовик** — Алый гриб, который легко воспламеняется (3 использования).
background.greenwise.table.2.2=**Дельфиниум** — Позволяет дышать под водой до одного часа (1 использование, можно разделить на несколько раз).
background.greenwise.table.2.3=**Клейкий стебель** — Деревянистый тростник, который превращается в прочный клей при жевании (2 использования).
background.greenwise.table.2.4=**Фонарь с блуждающим огоньком** — Клетка из кованого железа, дающая слабый свет, пока огонек ощущает неподалеку боль и страх.
background.greenwise.table.2.5=**Бомба с семенами** — Холщовый мешочек, наполненный семенами, взрывающимися при ударе. Урон к6 (взрыв, 3 использования).
background.greenwise.table.2.6=**Шиповник** — Опутывает любое существо размером до лошади (проверка СИЛ, чтобы освободиться, многоразовый).
