background.foundling.table.1.prompt=Кто вас приютил?
background.foundling.table.1.1=Старый охотник. Вы были счастливы вместе, пока все не закончилось. Возьмите потрепанный **Длинный лук** (к8, _громоздкий_) и **Кожаный жакет** (Броня +1).
background.foundling.table.1.2=Мудрый формацевт, который обучил вас искусству исцеления, но сохранял эмоциональную отстраненность. Возьмите **Лечебную мазь** (восстанавливает 1к4 СИЛ, 1 использование).
background.foundling.table.1.3=Друид, который научил вас языку деревьев. Когда пришло время уйти, вы взяли с собой только **Корявый посох** (к8) и дали обещание однажды вернуться.
background.foundling.table.1.4=Суровый кузнец из тихого речного городка. Он всегда держал вас поблизости. Теперь кузница холодна, и вы отправились дальше. Возьмите **Фартук кузнеца** (_мелкий_) и **Кольчужный доспех** (Броня +2, _громоздкий_), который часто чинили.
background.foundling.table.1.5=Труппа странствующих артистов. Некоторое время они были для вас как семья. Однажды вы проснулись, а они исчезли без объяснений. Начните игру со **Сборником рассказов**, **Кинжалом** (к6) и множеством вопросов без ответов.
background.foundling.table.1.6=Монахи из уединенного лесного монастыря. Когда их правила стали слишком строгими, вы сбежали. Возьмите **Монашескую рясу** (_теплая_, _мелкий_) и **Книгу заклинания** «Управление растениями». Управление растениями: _ближайшие растения и деревья подчиняются вам и получают способность медленно двигаться. Книга источает слабый запах разложения, а по ее корешку растут листья_.
background.foundling.table.2.prompt=Что уберегает вас от дурных происшествий?
background.foundling.table.2.1=**Трубочный табак** — Ваш талисман на удачу. Беседы обычно становятся легче после курения (6 использований).
background.foundling.table.2.2=**Вонючий сосуд** — Разбив этот сосуд, вы выпускаете такой отвратительный запах, что все поблизости должны пройти проверку СИЛ или немедленно вырвать (1 использование).
background.foundling.table.2.3=**Плющевой червь** — Зеленый червь, которого часто принимают за сорняк. Проглоченный целиком, он поглощает любые токсины или гниль в организме, а затем выходит естественным путем.
background.foundling.table.2.4=**Камень сновидений** — Гладкий синий камень, помогающий яснее вспоминать сны. Чрезмерное использование может вызвать зависимость от сновидений.
background.foundling.table.2.5=**Палочка утопления** — Деревянная палочка размером с палец, которая удваивается в размере каждый раз, когда полностью погружается в воду. Она не уменьшается обратно.
background.foundling.table.2.6=**Кроличья лапка** — Она была на вашей шее, когда вас нашли. Говорят, это лапка той, кто вас оставил, и что она защищает вас от ведьмовской магии (_мелкий_).
