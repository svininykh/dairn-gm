background.aurifex.table.1.prompt=Какой эксперимент пошел не так?
background.aurifex.table.1.1=Произошел взрыв, и вы потеряли обоняние. Ну, почти: теперь вы можете учуять золото, как свинья трюфели. Возьмите табакерку с нюхательным табаком (6 использований), чтобы ослабить эффект. Используйте его ежедневно, иначе получите _истощение_.
background.aurifex.table.1.2=Вы развоплотили любимого питомца, и теперь он следует за вами незримым духом. Хотя он не способен влиять на физический мир, вы можете обращаться к его ощущениям (добавляя каждый раз 1 **Усталость**), а также отдавать простые команды.
background.aurifex.table.1.3=Вы подверглись воздействию сыворотки правды, эффект от которой еще не прошел. В этом есть свое преимущество: вы не способны повторять услышанную ложь.
background.aurifex.table.1.4=Вы искусно создавали _фальшивое_ золото, почти такое же, как настоящее. В конце концов, вашу аферу раскрыли, а вам пришлось бежать. Добавьте в инвентарь тяжелый **Металлический слиток** и **Золотой порошок** (3 использования).
background.aurifex.table.1.5=Ваш алхимический рецепт сработал, но конкурент выкрал чертеж, прежде чем вы смогли заявить права на это изобретение. Запишите персонажу прототип **Мушкетона** (к12, _взрыв_, _громоздкий_), который требует одного раунда для перезарядки, и жажду мести
background.aurifex.table.1.6=Вы стали посмешищем за открытие способа превращения золота в _свинец_. Возьмите бутылку **Универсального растворителя** (2 исп.), который растворяет на составляющие все, к чему прикасается.
background.aurifex.table.2.prompt=Какое алхимическое чудо является вашим недавним изобретением?
background.aurifex.table.2.1=**Воспламеняющийся гель** — Липкая зеленая жидкость, загорающаяся при контакте с воздухом и горящая 8 часов. Невозможно потушить (1 использование).
background.aurifex.table.2.2=**Взрывная сфера** — Железный шар размером с голову. Наполнен порошком, взрывающимся при ударе  (к12, _взрыв_, _громоздкий_, 1 использование).
background.aurifex.table.2.3=**Живая вода** — Очищает любую жидкость, превращая ее в чистую воду, выпив которую, вы восстановите 1к6 СИЛ (1 использование).
background.aurifex.table.2.4=**Камень-мимик** — Записывает короткую фразу, которую можно воспроизвести позже.
background.aurifex.table.2.5=**Искрящаяся пыль** — Легко и быстро воспламеняется. Полезна для разжигания огня, может стать зажигательным устройством (3 использования).
background.aurifex.table.2.6=**Гомункул** — Ваша миниатюрная копия из глины, которая выполняет все ваши команды. Ненавидит подчиняться и жалуется при любой возможности. Любой урон, нанесенный гомункулу, также наносится вам [3 ОЗ, 4 СИЛ, 13 ЛОВ, 5 ВОЛ].
