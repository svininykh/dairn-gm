bond.1=Вы унаследовали **самоцвет** (500 золотых, холодный и хрупкий) от давно умершего родственника. Вместе с ним пришло предупреждение: если растратите это неожиданное богатство, будет востребован долг, о котором давно забыли.
bond.2=Дальний родственник оставил вам небольшое наследство: 20 золотых и **странный компас** (_мелкий_), который всегда указывает на нечто глубоко в Лесу.
bond.3=Вы носите с собой нарисованный от руки **портрет любимого человека** (_мелкий_), который давно исчез в Лесу. Каким-то образом вы знаете, что он еще жив.
bond.4=Вы обнаружили крошечную **хрустальную призму** (_мелкий_), зарытую в земле. Когда вы подносите ее к свету, внутри возникает образ неизвестного вам места глубоко в Лесу. Иногда вам кажется, что нечто смотрит на вас в ответ.
bond.5=Однажды вы освободили наяду из пересохшего ручья. В благодарность она подарила **серебряный мох** (_мелкий_). Если проглотить его рядом с водоемом, наяда придет к вам один раз, чтобы вернуть долг.
bond.6=Вы унаследовали **старый дневник**, переплетенный корой. Каждый вечер его страницы заполняются событиями дня, описанными с точки зрения самого дневника. Слог изложения груб, но правдив.
bond.7=Вы храните давнюю семейную тайну, приняв в наследство **половину древнего ключа** (_мелкий_). Говорят, если соединить его с другой половиной, он поможет пройти через любую дверь, используя **Врата**.
bond.8=Вы получили **письмо** (_мелкий_), содержащее неоспоримые доказательства вашего происхождения от фейской знати. В нем также указаны дата и место встречи с автором письма, глубоко в Лесу.
bond.9=Вы имеете значительный долг перед представителем знати и носите его **перстень с печаткой** (_мелкий_). Он служит как символом покровительства, так и вашей обязанности.
bond.10=Вы поглотили **озорного духа**, голос которого теперь звучит внутри вас и причиняет беспокойство. Он требует возвращения домой, глубоко в Лес, занимает один слот инвентаря, но ежедневно поглощает одну **Усталость**. Пока что ему выгодно, чтобы вы были живы.
bond.11=Бродячий рассказчик поведал вам историю о великом сокровище, спрятанном глубоко в Лесу. Вы считали это вымыслом, пока он не вручил вам **свернутую карту** (_мелкий_) с отметкой «X».
bond.12=Во время странствий вы встретили умирающего охотника, который попросил вас передать сообщение своим близким. У вас есть **письмо** (_мелкий_), запечатанное древесной смолой. Оно адресовано **Владыке Зимы**.
bond.13=Вы обнаружили раненое существо в Лесу, но решили не помогать ему. Теперь оно повсюду преследует вас, появляясь только когда вы одни. Оно выглядит печальным, но не злым. Вы не можете впасть в _панику_, действуя в одиночку.
bond.14=Вы пообещали другу детства привезти редкий подарок, уникальный в своем роде. У вас есть **Браслет** (_мелкий_), сплетенный из бечевки и полевых цветов.
bond.15=Вы перешли дорогу существу из Леса, и оно наложило на вас проклятие **Каменного сердца**. С каждым месяцем камень становится тяжелее, занимая дополнительный слот инвентаря. Пока вы не снимете это проклятие, вы не можете по-настоящему умереть.
bond.16=Вы вырезали **Свисток** (_мелкий_) из ветви Владыки Дуба. Ваш поступок не остался незамеченным. К тому же, вы не можете избавиться от этого свистка.
bond.17=**Отряд Рассвета** оказал вашей семье услугу, в знак чего подарил засушенный **Кроваво-красный цветок** (_мелкий_). Когда цветок станет белым - это будет знаком, что услуга должна быть оплачена.
bond.18=Однажды ваш дом посетил артист, наполнив его историями и песнями. Внезапно он ушел, не сказав ни слова, оставив после себя лишь **Миниатюрную лютню**, внутри которой что-то гремит.
bond.19=Вам приснилась белая ворона с веточкой в клюве. Проснувшись на следующее утро, вы обнаружили эту **Веточку** (_мелкий_) у себя в руке. Веточка слегка пахнет серой, но вы верите, что она приносит удачу.
bond.20=Один из ваших предков обидел **Моховую ведьму**, и она прокляла ваш род. Ваше отражение заставляет зеркала разбиваться вдребезги. Вы заметили, что осколки иногда могут развеять иллюзии.
omen.1=Воды некогда полноводной и дарующей жизнь реки почернели и стали зловонными, отравляя землю и вызывая болезни у тех, кто пьет из нее. Старейшина деревни указывает на недавнее осквернение как на причину, но большинство не прислушивается к его словам.
omen.2=В этом году зима наступила слишком быстро: морозы и снегопады появились гораздо раньше, чем ожидалось. Говорят, что узоры инея на окнах, прудах и трещинах в земле напоминают карту.
omen.3=Густой, неестественный туман начал окутывать священную рощу. Говорят, это дело рук великого лесного духа, разгневанного вырубкой близлежащих лесов.
omen.4=Ночное небо с каждым вечером становится все темнее, словно звезды исчезают одна за другой. Слухи о демонических существах, похищающих фермеров и утаскивающих их под самые Корни, распространяются как лесной пожар. Старейшины деревни считают, что эти события связаны между собой.
omen.5=Певчие птицы Леса в последнее время зловеще умолкли. Охотники утверждают, что видели призрачную фигуру, блуждающую по чаще и с тоской смотрящую на каждого встречного.
omen.6=Странные, слезообразные камни были найдены по всему региону, вызвав своего рода «золотую лихорадку» среди ювелиров и воров. Местные жители верят, что это слезы самой земли, оплакивающей грядущую трагедию.
omen.7=Рои вредителей нарушают спокойствие снов, а фермеры говорят о громком жужжании, исходящем из глубин Леса. Они также уверены, что этот звук становится все ближе.
omen.8=Есть деревня, известная своим впечатляющим «материнским древом», которое, как говорят, хранит секреты города в своих ветвях. Недавно оно начало истекать красным соком, что беспокоит старейшин.
omen.9=Луна окрасилась в багровый, и теперь заливает ночь зловещим, кроваво-красным светом. Некоторые говорят, что это предвещает время хаоса и раздора, так как границы между Лесом и миром смертных становятся тоньше.
omen.10=В ночном небе появились странные трещины, расползающиеся клубящимися вихрями света и цвета. Некоторые утверждают, что границы миров сейчас наиболее тонки, и боятся того, что может появиться с другой стороны.
omen.11=Ночной цветок, считавшийся вымершим, снова распространился по всему Лесу. Его аромат опьяняюще прекрасен, но также вызывает яркие кошмары.
omen.12=Местный скот в последнее время стал все более беспокойным и неуправляемым. Старый пастух говорит, что это из-за тревожного воя, исходящего из Леса каждое полнолуние.
omen.13=Рои насекомых массово покидают Лес, разрушая все деревянные строения на своем пути. Звук от их крыльев напоминает знакомую мелодию, когда они пролетают над головой, словно забытый детский стишок.
omen.14=Охотники говорят о проклятии, которое постигает каждого, кто убивает зверя с белой шерстью: вскоре их находят мертвыми в своих домах. С каждым днем зверей для охоты становится все меньше и меньше.
omen.15=Говорят, что из колодцев по всему городу доносится слабый смех, который ночью превращается в рыдания.
omen.16=Созвездия медленно начинают смещаться в ночном небе, образуя незнакомые узоры, что озадачивает астрономов и мудрецов. Даже животные кажутся обеспокоенными.
omen.17=Древнее дерево в самом сердце тихой деревни внезапно засохло и погибло, несмотря на отсутствие признаков болезни. После того как его ствол был разрезан, в сердцевине нашли окровавленную руку.
omen.18=Статуи плачут кровью уже несколько месяцев подряд, и в деревне не рождаются дети. Единственный ребенок стал исключением, и старейшины, охваченные страхом и ужасом, спрятали его.
omen.19=Местная фауна ведет себя странно, проявляя повышенную агрессию или полностью покидая обжитые места. Охотники говорят о теневой фигуре, бродящей по Лесу и призывающей животных.
omen.20=В последние недели приграничные города стали бунтовать после заявлений о том, что их детям во снах является фигура в красном и произносит одно и то же предупреждение: «Грядет огонь, что поглотит все.»
