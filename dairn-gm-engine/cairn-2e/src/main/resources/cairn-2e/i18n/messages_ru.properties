background.aurifex.table.1.prompt=Какой эксперимент пошел не так?
background.aurifex.table.1.1=Произошел взрыв, и вы потеряли обоняние. Ну, почти: теперь вы можете учуять золото, как свинья трюфели. Возьмите табакерку с нюхательным табаком (6 использований), чтобы ослабить эффект. Используйте его ежедневно, иначе получите _истощение_.
background.aurifex.table.1.2=Вы развоплотили любимого питомца, и теперь он следует за вами незримым духом. Хотя он не способен влиять на физический мир, вы можете обращаться к его ощущениям (добавляя каждый раз 1 **Усталость**), а также отдавать простые команды.
background.aurifex.table.1.3=Вы подверглись воздействию сыворотки правды, эффект от которой еще не прошел. В этом есть свое преимущество: вы не способны повторять услышанную ложь.
background.aurifex.table.1.4=Вы искусно создавали _фальшивое_ золото, почти такое же, как настоящее. В конце концов, вашу аферу раскрыли, а вам пришлось бежать. Добавьте в инвентарь тяжелый **Металлический слиток** и **Золотой порошок** (3 использования).
background.aurifex.table.1.5=Ваш алхимический рецепт сработал, но конкурент выкрал чертеж, прежде чем вы смогли заявить права на это изобретение. Запишите персонажу прототип **Мушкетона** (к12, _взрыв_, _громоздкий_), который требует одного раунда для перезарядки, и жажду мести
background.aurifex.table.1.6=Вы стали посмешищем за открытие способа превращения золота в _свинец_. Возьмите бутылку **Универсального растворителя** (2 исп.), который растворяет на составляющие все, к чему прикасается.
background.aurifex.table.2.prompt=Какое алхимическое чудо является вашим недавним изобретением?
background.aurifex.table.2.1=**Воспламеняющийся гель** — Липкая зеленая жидкость, загорающаяся при контакте с воздухом и горящая 8 часов. Невозможно потушить (1 использование).
background.aurifex.table.2.2=**Взрывная сфера** — Железный шар размером с голову. Наполнен порошком, взрывающимся при ударе  (к12, _взрыв_, _громоздкий_, 1 использование).
background.aurifex.table.2.3=**Живая вода** — Очищает любую жидкость, превращая ее в чистую воду, выпив которую, вы восстановите 1к6 СИЛ (1 использование).
background.aurifex.table.2.4=**Камень-мимик** — Записывает короткую фразу, которую можно воспроизвести позже.
background.aurifex.table.2.5=**Искрящаяся пыль** — Легко и быстро воспламеняется. Полезна для разжигания огня, может стать зажигательным устройством (3 использования).
background.aurifex.table.2.6=**Гомункул** — Ваша миниатюрная копия из глины, которая выполняет все ваши команды. Ненавидит подчиняться и жалуется при любой возможности. Любой урон, нанесенный гомункулу, также наносится вам [3 ОЗ, 4 СИЛ, 13 ЛОВ, 5 ВОЛ].
background.barber-surgeon.table.1.prompt=Как вы «усовершенствовали» себя?
background.barber-surgeon.table.1.1=Ваш искусственный _глаз_ позволяет рассматривать предметы, как в телескоп, и минимально ориентироваться в темноте. Однако вы не можете надевать на голову металлические предметы, а сильные магниты приводят вас к _истощению_.
background.barber-surgeon.table.1.2=Одна из ваших **ног** почти полностью металлическая (пинок наносит 1к6), что позволяет вам считать некоторые типы труднопроходимой местности как **Легкая**. У вас при себе **Масленка** (6 использований); без ежедневного смазывания вы становитесь _истощенным_ и издаете скрип при движении.
background.barber-surgeon.table.1.3=Кость одного из ваших пальцев заменена протезом из золота и железа. У вас есть **Крюк** и **Отвертка**, которые можно закрепить на кончике пальца.
background.barber-surgeon.table.1.4=Ваши **Уши** хирургически модифицированы, что значительно утончает ваш слух. Вы можете сосредоточиться на определенном звуке, например, разговоре на большом расстоянии. Вы носите ушные накладки для защиты от внезапных громких звуков  (успешный спасбросок ВОЛ позволяет избежать временного паралича).
background.barber-surgeon.table.1.5=Ваша **грудь** покрыта алхимическими символами, делающими кожу более _прочной_ (Броня +1). При этом ношение металлической брони нейтрализует этот эффект.
background.barber-surgeon.table.1.6=Одна из ваших **рук** полностью металлическая и может отсоединяться от плеча. Ее можно использовать как оружие (d8; _громоздкий_, когда не прикреплена) и она способна двигаться самостоятельно, если вы находитесь в пределах видимости.
background.barber-surgeon.table.2.prompt=Какой редкий инструмент незаменим в вашей работе?
background.barber-surgeon.table.2.1=**Мазь регенерации** — Восстанавливает утраченную часть тела в течение дня (1 использование).
background.barber-surgeon.table.2.2=**Приращивающий червь** — Маленький червь, способный сращивать неодушевленные объекты с частями тела (1 использование).
background.barber-surgeon.table.2.3=**Воск для ран** — Заживляет раны от огня или химических ожогов, полностью восстанавливая СИЛ, но не лечит другие повреждения (2 использования).
background.barber-surgeon.table.2.4=**Ртуть** — Стимулятор, позволяющий действовать первым в бою и автоматически проходить спасброски ВОЛ в течение одного часа. Вызывает зависимость: через 24 часа без применения, пройдите спасбросок СИЛ, иначе станете истощенным (4 использования).
background.barber-surgeon.table.2.5=**Пневматический насос** — Портативные железные легкие (_громоздкий_), позволяющие проводить операции или дышать под водой.
background.barber-surgeon.table.2.6=**Магнитный камень** — Вытягивает опасные элементы из тела и действует как мощный магнит.
background.beast-handler.table.1.prompt=На каких существах вы специализируетесь?
background.beast-handler.table.1.1=**Паукообразные** — Возьмите **Воспламеняющий жезл** и **Масленку** (6 использований). Они способны уничтожить большое паучье гнездо за считанные секунды.
background.beast-handler.table.1.2=**Кошачьи** — Возьмите мешок с **Ус-травой**. Ее запах может успокоить и подчинить даже самых крупных кошек.
background.beast-handler.table.1.3=**Псовые** — Возьмите венок из **Аконита** и **Большую сеть**. Также эффективно против оборотней!
background.beast-handler.table.1.4=**Птицы** — Возьмите **Манок** (3 заряда). Он может имитировать любой птичий крик и также использоваться для передачи простых сообщений. **Перезарядка**: покормите птенца, как это сделала бы его мать, а затем подуйте в свисток.
background.beast-handler.table.1.5=**Грызуны** — Возьмите **Флейту Пана**, издающий высокочастотный звук, который слышат только грызуны. Пока вы играете, они будут следовать за вами, даже к собственной гибели.
background.beast-handler.table.1.6=**Змеи** — Возьмите **Согревающий камень**, излучающий тепло и привлекающий змей, а также **Противоядие** (2 использования).
background.beast-handler.table.2.prompt=Что понимают дикие существа, но не осознают ваши сородичи?
background.beast-handler.table.2.1=Мир гораздо глубже, чем кажется. Сосредоточившись в тишине, вы можете заимствовать чувства ближайшего существа вашей **специализации**.
background.beast-handler.table.2.2=Поведение зверей — это язык. Наблюдая за существами вашей **специализации**, вы получаете знания о погодных условиях и надвигающихся катастрофах.
background.beast-handler.table.2.3=Охота — это пульс жизни. Вы чувствуете присутствие хищников, даже если они не относятся к вашей **специализации**.
background.beast-handler.table.2.4=Вы знаете эти земли как свои пять пальцев. Ваш шанс заблудиться в местности, где доминируют существа вашей **специализации**, уменьшается на одну ступень (например, с 4-из-6 до 3-из-6).
background.beast-handler.table.2.5=Природная симфония слышна тем, кто способен настроиться. Когда вы окружены существами своей **специализации**, они могут предупредить вас о приближении опасности.
background.beast-handler.table.2.6=Выживание — это адаптация. Один раз в день вы можете заимствовать простую особенность существа вашей **специализации** (например, перепонки на пальцах, ночное зрение и т. д.). Добавьте одну **Усталость** за каждое использование.
background.bonekeeper.table.1.prompt=Что вы взяли у мертвых?
background.bonekeeper.table.1.1=**Амулет в форме ворона**. Вы можете задавать вопросы мертвым, но за каждое использование добавляйте одну **Усталость**.
background.bonekeeper.table.1.2=**Смертельная рана**, полученная от _ревенанта_. Вас исцелили, но уродливые шрамы сделали вас изгоем. Вам не нужны воздух и пища, но вы все еще подвержены боли и смерти. Застряв между мирами, вы воспринимаетесь мертвыми как один из них.
background.bonekeeper.table.1.3=**Ведро крови** (_громоздкий_) от местного культа смерти. Опустошите его, чтобы поднять слугу из останков. У него будет: 6 ОЗ, Броня 1, 13 СИЛ, 11 ЛОВ, 4 ВОЛ и кулаки с острыми осколками (к8+8а). Вы можете воскресить только одного слугу за раз. Если он уничтожен, вы навсегда теряете 1к4 СИЛ. **Перезарядка**: наполните ведро кровью умирающего воина.
background.bonekeeper.table.1.4=**Похоронная повозка** (+6 слотов) с последнего места работы. В комплекте с упрямым старым **Ослом** (+4 слота;  только +2 слота, если тянет повозку; медленный).
background.bonekeeper.table.1.5=Книга заклинания «Обнаружение магии», украденная из древней библиотеки. Ваша семья служила малоизвестному божеству подземного мира, но вы утратили веру. Несмотря на изгнание, вы продолжаете служить. Обнаружение магии: _вы можете видеть или слышать магические ауры рядом с собой. Книга становится теплой на ощупь, когда неподалеку используется магия_
background.bonekeeper.table.1.6=Маска **чумного доктора**. Ее владелец скончался от болезни, уничтожившей всех, кого вы знали. Ему не следовало ее снимать.
background.bonekeeper.table.2.prompt=Какой инструмент был незаменим в вашей работе?
background.bonekeeper.table.2.1=**Кандалы** — Хоть и старые, все еще эффективны против очень сильных существ. У вас нет ключа.
background.bonekeeper.table.2.2=**Губка** — Предположительно сделана из останков редкого морского существа. Кажется, она никогда не высыхает.
background.bonekeeper.table.2.3=**Шкив** — Отлично подходят для перемещения надгробий, камней или тел.
background.bonekeeper.table.2.4=**Ладан** — Идеален для ритуалов или отпугивания мух. Охлаждает кровь.
background.bonekeeper.table.2.5=**Лом** — Наносит к6а. Иногда нужно просто вскрыть эту чертову штуку!
background.bonekeeper.table.2.6=**Репеллент** — Мощная штука. Его выцветшая этикетка не позволяет точно определить, от _кого_ он должен защищать.Возможно, от всех подряд. 3 использования.
background.cutpurse.table.1.prompt=Какое было ваше последнее крупное дело?
background.cutpurse.table.1.1=Летний домик дворянина. В этом месте было полно изысканного вина (+20 зм), но больше ничего ценного. Возьмите **Кусачки для проволоки**.
background.cutpurse.table.1.2=Банк (вас поймали). На вас есть клеймо, видимое только при свете огня, и любой, кто увидит клеймо, может попросить у вас пива. Возьмите **Катушку с проводом**.
background.cutpurse.table.1.3=Склад гильдии. Возьмите **Лестницу** (_громоздкий_, 10 фт) и **Ослепляющий порошок** (1 использование).
background.cutpurse.table.1.4=Ростовщик. Кто-то опередил вас, но оставил **свиток** «Магический глаз» (_мелкий_). **Магический глаз**: _вы можете видеть через парящий магический глаз, который летает неподалеку и перемещается по вашей команде._
background.cutpurse.table.1.5=Комната констебля. Вы сбежали, но бросили друзей позади. Начните игру с **Прочной шелковой веревкой** и ощущением тошноты от своего поступка.
background.cutpurse.table.1.6=Университет. Вас заметили, но не преследовали. Вы до сих пор не знаете, почему. Возьмите **Дымовые бомбы** (3 использования).
background.cutpurse.table.2.prompt=Что помогает вам воровать??
background.cutpurse.table.2.1=**Кольцо-кошки** — 2 заряда. Позволяет взбираться по стенам и безопасно падать. **Перезарядка**: наденьте кольцо на хвост бездомной кошки.
background.cutpurse.table.2.2=**Золотой палец** — 1 заряд. Накладка на палец, имитирующая любой обычный ключ. **Перезарядка**: оставьте ее на ночь вместе с не менее чем 100 зм.
background.cutpurse.table.2.3=**Стекло подглядывания** — 3 использования. Монокль, позволяющий видеть сквозь стены или другие преграды. Разбивается после последнего использования.
background.cutpurse.table.2.4=**Сладкий свисток** — 1 заряд. Окружающие слышат мягкий знакомый голос вдалеке. Они следуют за ним, не в силах сопротивляться. **Перезарядка**: потеряйте дорогое воспоминание (опишите его).
background.cutpurse.table.2.5=**Покров бродяги** — 1 заряд. Наденьте его, чтобы незаметно слиться с толпой, выглядя как простой нищий. **Перезарядка**: пожертвуйте весь дневной заработок бедным. _Мелкий_ предмет.
background.cutpurse.table.2.6=**Обратный тетотум** — 1 использование. При вращении, отматывает время на 30 секунд назад. Все помнят,  что произошло.
background.fieldwarden.table.1.prompt=Что вас одолело?
background.fieldwarden.table.1.1=Ненасытная стая вредителей, пожиравшая урожай и животных. Оставшись без средств защиты, вы ушли. Возьмите **Экстракт семян бури** (3 использования). Выпив его, вы сможете бежать в четыре раза быстрее обычного. После этого добавьте две **Усталости**.
background.fieldwarden.table.1.2=Дух урожая, разгневанный скудным подношением. Огонь уничтожил почти все, но вам удалось собрать мешочек **Огненных семян** (к8, _взрыв_, 4 использования).
background.fieldwarden.table.1.3=Рогатый, зубастый демон, едва не убивший вас. Возьмите окровавленный **Костяной нож** (к6). При нанесении _Критического Урона_, его следующая атака становится _Усиленной_ из-за контакта с кровью.
background.fieldwarden.table.1.4=_Увядание_ — вид стеблевой гнили из Корней. Возьмите **Зараженный урожай** (6 использований), который быстро разлагает любое растение, к которому прикасается.
background.fieldwarden.table.1.5=Волки, по крайней мере, вы так думали.. Теперь вы — **Оборотень**  [8 ОЗ, 15 СИЛ, 14 ЛОВ, когти (к6+к6), укус (к8)]. Ваша ВОЛ остается прежней. Вы можете превращаться по желанию (раз в день), но должны пройти проверку ВОЛ, чтобы вернуть себе человеческий облик. Любой, кто выжил после вашей атаки, должен пройти проверку ВОЛ, чтобы избежать заражения.
background.fieldwarden.table.1.6=Воры урожая. Не все из них выжили, но вас было меньше. Начните с +1к4 ОЗ и **Зазубренным фальшионом** (к8).
background.fieldwarden.table.2.prompt=Какой инструмент спас вам жизнь?
background.fieldwarden.table.2.1=**Кнут из кровавой лозы** — Урон к8. При **Критическом Уроне** высасывает из цели кровь, придавая следующей атаке свойство _взрыва_.
background.fieldwarden.table.2.2=**Коробка-хлопушка** — Ручное устройство, издающее громкий шум, отпугивающий большинство существ.
background.fieldwarden.table.2.3=**Солнечная палочка** — Обеспечивает достаточное тепло и свет в течение одного часа (1 использование). **Перезарядка**: оставьте на целый день на ярком солнце.
background.fieldwarden.table.2.4=**Корневая привязь** — Метнув, вы на короткое время свяжете существо размером с волка с землей.
background.fieldwarden.table.2.5=**Зеленый свисток** — Небольшая флейта, успокаивающая растения и облегчающая проход через заросли.
background.fieldwarden.table.2.6=**Вечноцветущий браслет** — Браслет, украшенный цветами, которые никогда не вянут. Когда вы получите **Критический Урон**, цветы обратятся в пыль, но вы сможете считать, что успешно прошли спасбросок (это не избавит вас от потери СИЛ).
background.fletchwind.table.1.prompt=Как вы заслужили свой лук??
background.fletchwind.table.1.1=**Война**. Если вы атакуете первым, в первом раунде ваши выстрелы получают свойство взрыв.
background.fletchwind.table.1.2=**Соколиная охота**. У вас есть сокол, и он ест только живую добычу. [3 ОЗ, 5 СИЛ, 16 ЛОВ, 4 ВОЛ, когти (к6+к6), клюв (к8)].
background.fletchwind.table.1.3=**Охота**. При выполнении действия «Снабжение», ваша способность добывать **Пайки** увеличивается на **одну ступен** (например, 1к4 становится 1к6).
background.fletchwind.table.1.4=**Турниры**. Ваши атаки из лука становятся _усиленными_, если цель обездвижена.
background.fletchwind.table.1.5=**Тренировка**. Если вы атакуете первым, атаки в ближнем бою против вас _ослаблены_, пока вы не получите урон по СИЛ.
background.fletchwind.table.1.6=Разведка. При выполнении действия «Путешествие», ваше присутствие снижает шанс заблудиться на одну ступен (например, 4-из-6 становится 3-из-6).
background.fletchwind.table.2.prompt=Из какого дерева сделан ваш лук?
background.fletchwind.table.2.1=**Западный тис** (к6, _громоздкий_). Может использоваться в качестве оружия с дробящим уроном в ближнем бою (к6 урон). Шумный.
background.fletchwind.table.2.2=**Скальный дуб** (к8, _громоздкий_). Ваши выстрелы поразительно мощны. При нанесении **Критического Урона** что-то отрывается.
background.fletchwind.table.2.3=**Каменная сосна** (к6, _громоздкий_). Производит одну порцию **Липкой смолы** в день. Аккуратно, смола крайне взрывоопасна.
background.fletchwind.table.2.4=**Белый ясень** (к6, _громоздкий_). Может использоваться вместо щита в ближнем бою (Броня +1).
background.fletchwind.table.2.5=Полосатый бамбук (к6). Складной, занимает только один слот (но все равно требует обеих рук для использования).
background.fletchwind.table.2.6=**Ведьмин вяз** (к6, громоздкий). Защищает носителя от ядов и токсинов, пока он держит лук.
background.foundling.table.1.prompt=Кто вас приютил?
background.foundling.table.1.1=Старый охотник. Вы были счастливы вместе, пока все не закончилось. Возьмите потрепанный **Длинный лук** (к8, _громоздкий_) и **Кожаный жакет** (Броня +1).
background.foundling.table.1.2=Мудрый формацевт, который обучил вас искусству исцеления, но сохранял эмоциональную отстраненность. Возьмите **Лечебную мазь** (восстанавливает 1к4 СИЛ, 1 использование).
background.foundling.table.1.3=Друид, который научил вас языку деревьев. Когда пришло время уйти, вы взяли с собой только **Корявый посох** (к8) и дали обещание однажды вернуться.
background.foundling.table.1.4=Суровый кузнец из тихого речного городка. Он всегда держал вас поблизости. Теперь кузница холодна, и вы отправились дальше. Возьмите **Фартук кузнеца** (_мелкий_) и **Кольчужный доспех** (Броня +2, _громоздкий_), который часто чинили.
background.foundling.table.1.5=Труппа странствующих артистов. Некоторое время они были для вас как семья. Однажды вы проснулись, а они исчезли без объяснений. Начните игру со **Сборником рассказов**, **Кинжалом** (к6) и множеством вопросов без ответов.
background.foundling.table.1.6=Монахи из уединенного лесного монастыря. Когда их правила стали слишком строгими, вы сбежали. Возьмите **Монашескую рясу** (_теплая_, _мелкий_) и **Книгу заклинания** «Управление растениями». Управление растениями: _ближайшие растения и деревья подчиняются вам и получают способность медленно двигаться. Книга источает слабый запах разложения, а по ее корешку растут листья_.
background.foundling.table.2.prompt=Что уберегает вас от дурных происшествий?
background.foundling.table.2.1=**Трубочный табак** — Ваш талисман на удачу. Беседы обычно становятся легче после курения (6 использований).
background.foundling.table.2.2=**Вонючий сосуд** — Разбив этот сосуд, вы выпускаете такой отвратительный запах, что все поблизости должны пройти проверку СИЛ или немедленно вырвать (1 использование).
background.foundling.table.2.3=**Плющевой червь** — Зеленый червь, которого часто принимают за сорняк. Проглоченный целиком, он поглощает любые токсины или гниль в организме, а затем выходит естественным путем.
background.foundling.table.2.4=**Камень сновидений** — Гладкий синий камень, помогающий яснее вспоминать сны. Чрезмерное использование может вызвать зависимость от сновидений.
background.foundling.table.2.5=**Палочка утопления** — Деревянная палочка размером с палец, которая удваивается в размере каждый раз, когда полностью погружается в воду. Она не уменьшается обратно.
background.foundling.table.2.6=**Кроличья лапка** — Она была на вашей шее, когда вас нашли. Говорят, это лапка той, кто вас оставил, и что она защищает вас от ведьмовской магии (_мелкий_).
background.fungal-forager.table.1.prompt=Какой странный гриб вы обнаружили?
background.fungal-forager.table.1.1=**Кричащая труба**. При воздействии света издает такой громкий крик, что все ближайшие атаки (включая ваши собственные) становятся _ослабленными_ (2 использования).
background.fungal-forager.table.1.2=**Факельный гриб**. При раздавливании излучает холодный синий свет в течение короткого времени (2 использования).
background.fungal-forager.table.1.3=**Убийственный трюфель**. Резкий, высокотоксичный и очень редкий (можно продать убийцам за 50 зм). Практически везде считается вне закона (1 использование).
background.fungal-forager.table.1.4=**Чертовка**. Воздействие ее аромата вызывает сильную тошноту, вплоть до рвоты. Тем не менее, превосходно очищает помещение. Хранится в бутылке (1 использование).
background.fungal-forager.table.1.5=**Чашечный росток**. При употреблении уменьшает вас до размеров мыши, вещи остаются прежнего размера. Вы возвращаетесь к нормальному виду в течение часа, процесс проходит рывками (1 использование).
background.fungal-forager.table.1.6=**Корневой цветок**. Белый гриб, встречающийся лишь на трупах, зарытых глубоко в землю. При употреблении восстанавливает 1к6 ВОЛ. Вам будут сниться мертвецы и их история (1 использование).
background.fungal-forager.table.2.prompt=Что помогает вам сохранять рассудок даже в полной темноте?
background.fungal-forager.table.2.1=**Светящийся улитка** — Излучает мягкий биолюминесцентный свет. Питается одной порцией пищи каждые два дня.
background.fungal-forager.table.2.2=**Шаль Шелкового Мотылька** — Водонепроницаемое одеяло, способное потушить огонь без повреждений.
background.fungal-forager.table.2.3=**Молочный цветок** — Легкий стимулятор. Жевание делает вас невосприимчивым к _панике_ на следующий час (3 использования).
background.fungal-forager.table.2.4=**Светокомпас** — Тихо гудит по мере приближения к солнцу. Со временем шум становится невыносимо громким.
background.fungal-forager.table.2.5=**Ленивый тент** — Прочный и водонепроницаемый материал, пригодный для подвешивания на деревьях. Когда вы внутри, получаете +1 к броне.
background.fungal-forager.table.2.6=**Шахтерская смазка** — Отлично подходит для высвобождения драгоценного камня, инструмента или конечности из узкой щели. Крайне взрывоопасна (3 использования).
background.greenwise.table.1.prompt=Как Лес подвел вас?
background.greenwise.table.1.1=Раздосадованный дух леса проклял вас за воровство, пометив как врага. Возьмите **Камень безоара**. Прием внутрь излечивает от любого яда (1 использование, если камень не извлечен).
background.greenwise.table.1.2=Ваш близкий друг исчез в лесу. Теперь вы видите его лицо в любом заваренном чае. Возьмите **Усыпляющий отвар** (3 использования).
background.greenwise.table.1.3=Вы были отравлены, потеряли вкус и обоняние. Теперь вы можете выдерживать ядовитые пары и всегда носите с собой **Противоядие** (2 использования).
background.greenwise.table.1.4=Ваши радикальные эксперименты окрасили вашу кожу в зеленый цвет, и теперь вы питаетесь как растение. Вам не нужен **Пайок**, но день без достаточного количества солнца и воды делает вас _истощенным_.
background.greenwise.table.1.5=Ваше впечатляющее хищное растение выиграло местный конкурс, но затем убило одного из судей. Вы сбежали, прихватив **Призовые деньги (100 зм)** и став разыскиваемой персоной.
background.greenwise.table.1.6=Вы создали восстанавливающую настойку, которая с некоторым шансом способна привести к бесплодию. Возьмите **Лечебное зелье**, полностью восстанавливающее СИЛ. Только вы знаете о его побочном эффекте.
background.greenwise.table.2.prompt=Что защищает вас в Лесу?
background.greenwise.table.2.1=**Трутовик** — Алый гриб, который легко воспламеняется (3 использования).
background.greenwise.table.2.2=**Дельфиниум** — Позволяет дышать под водой до одного часа (1 использование, можно разделить на несколько раз).
background.greenwise.table.2.3=**Клейкий стебель** — Деревянистый тростник, который превращается в прочный клей при жевании (2 использования).
background.greenwise.table.2.4=**Фонарь с блуждающим огоньком** — Клетка из кованого железа, дающая слабый свет, пока огонек ощущает неподалеку боль и страх.
background.greenwise.table.2.5=**Бомба с семенами** — Холщовый мешочек, наполненный семенами, взрывающимися при ударе. Урон к6 (взрыв, 3 использования).
background.greenwise.table.2.6=**Шиповник** — Опутывает любое существо размером до лошади (проверка СИЛ, чтобы освободиться, многоразовый).
background.half-witch.table.1.prompt=Что вам досталось от Незримого двора?
background.half-witch.table.1.1=**Скрипка из черной розы** (_громоздкий_). Ее музыка вызывает у смертных сильную печаль и обездвиживает их. На иных она производит лишь завораживающий эффект. Вы не умеете играть на скрипке.
background.half-witch.table.1.2=**Бумажные ноги**. Вы чрезвычайно легки и можете падать с высоты нескольких этажей без травм. Постарайтесь не намочить их и не порвать.
background.half-witch.table.1.3=**Кошмарное существо**, обитающее внутри вас и проявляющееся, когда вы в опасности. Оно обладает такими же Характеристиками и Очками Защиты, как и вы, и атакует когтями (к8+к8). Исчезает при получении **Критического Урона** (вы теряете 1к4 ВОЛ), и появляется вновь на следующее полнолуние.
background.half-witch.table.1.4=Ворон-фамильяр. Он говорит как разумное существо и полностью предан вам. [8 ОЗ, 3 СИЛ, 11 ЛОВ, 13 ВОЛ, клюв (к6 урон)]
background.half-witch.table.1.5=**Шип шиповника**. Он может проколоть любой органический материал (довольно болезненно), но при извлечении не оставляет следов.
background.half-witch.table.1.6=**Истинное имя феи**. Используйте его, чтобы призвать владельца для выполнения значимой услуги, но только один раз. Также может быть продано за значительную сумму подходящему покупателю.
background.half-witch.table.2.prompt=Какую алхимическую смесь вы носите с собой и какие редкие ингредиенты вы собрали для ее изготовления?
background.half-witch.table.2.1=**Пепел возрождения** — Останки берестяного духа. Развейте над целью, чтобы вновь зажечь потухший огонь или вернуть к жизни существо, умершее мгновение назад (3 использования).
background.half-witch.table.2.2=**Гламурное перо** — Перо жар-птицы. Может заставить любое существо выглядеть как кто-то (или что-то) другое (1 использование).
background.half-witch.table.2.3=**Семя из иного мира** — Желудь из иного мира, собранный в день весеннего равноденствия. При посадке, вырастает в роскошное укрытие, которое исчезает на закате следующего дня (1 использование).
background.half-witch.table.2.4=**Сок камнедрева** — Получен в обмен на кровь. Затвердевает при нанесении на любую поверхность (+1 к броне, 3 использования).
background.half-witch.table.2.5=**Порошок ночной пыли** — Изготовлен путем ритуального сжигания шести сов. При распылении в воздухе, на короткое время превращает день в ночь (2 использования).
background.half-witch.table.2.6=**Шестигранный камень** — Собран из реки, текущей из _иного мира_. Вынутый из железной коробочки, он может поглотить эффект заклинания. При разрушении камня магия освобождается (1 использование).
background.hexenbane.table.1.prompt=К какому ордену вы принадлежите?
background.hexenbane.table.1.1=**Орден Перекрестков**. Возьмите **Карманный лейфайндер**. Он указывает на ближайшие лей линии и другие источники магической силы. Если вы его потеряете, наказанием будет смерть.
background.hexenbane.table.1.2=**Орден Кровоточащей Звезды**. Возьмите **Булаву** из **Звездного железа** (к8). Она слабо светится в темноте и становится очень горячей в присутствии ведьмовства.
background.hexenbane.table.1.3=**Орден Стеклянного Символа**. Возьмите **Короткий меч** (к8) и **Кольчугу** (Броня +2, _громоздкий_). У вас есть контакты в большинстве поселений, готовые предоставить помощь, еду и даже оружие.
background.hexenbane.table.1.4=**Орден Пустого Ока**. Возьмите **осколок пустотного стекла**. Загляните в него, чтобы увидеть невидимые метки, существ и другие магические эффекты. После использования один ваш глаз теряет зрение на один час и вы получаете _истощение_.
background.hexenbane.table.1.5=**Орден Канааса**. Один раз в день вы можете превращаться в волка. Возьмите **Ртутную цепь**. Без нее вам не обернуться обратно.
background.hexenbane.table.1.6=**Орден Безмолвной Вуали**. Возьмите **Камень подавления**, завернутый в мешковину. Гасит любые огни поблизости при контакте с воздухом (2 использования).
background.hexenbane.table.2.prompt=Каков был ваш обет?
background.hexenbane.table.2.1=**Честность** — Выберите **тип оружия** (дробящее, колющее и т.д.). Атаки против вас этим типом оружия _ослаблены_. Если вы нарушите обет, то потеряете 1к4 ВОЛ.
background.hexenbane.table.2.2=**Бедность** — У вас есть **Книга заклинания** «Разборка». Только вы можете ее использовать. Если вы нарушите обет, она взорвется, нанеся 1к12 урона СИЛ.Разборка: любая часть вашего тела может быть отсоединена и присоединена по желанию, без боли или повреждений. Вы все еще можете их контролировать. _Восстанавливает любые порванные или поврежденные страницы._
background.hexenbane.table.2.3=**Альтруизм** — Вы невосприимчивы к магическим эффектам, таким как очарование, ненависть, безумие и т.д. Если вы нарушите этот обет, то потеряете 1к6 ВОЛ.
background.hexenbane.table.2.4=**Милосердие** — Выберите **тип оружия** (дробящее, колющее и т.д.). Атаки этим оружием получают _усиление_. Если вы нарушите обет, то больше никогда не сможете использовать этот тип оружия.
background.hexenbane.table.2.5=**Щедрость** — Один раз в день вы можете снять одну **Усталость**. Если вы нарушите обет, то навсегда потеряете один слот инвентаря.
background.hexenbane.table.2.6=**Доблесть** — В первый раз, нанеся **Критический Урон**, вы получаете +1к4 к ОЗ, возвращаясь к прежнему лимиту в конце боя. Если вы нарушите обет, то умрете.
background.jongleur.table.1.prompt=Что произошло на вашем последнем выступлении?
background.jongleur.table.1.1=Несмотря на вашу подготовку в смертельных искусствах, один из актеров погиб, и вас обвинили в этом. Начните игру с легкой рапирой (к6) и фальшивой личностью.
background.jongleur.table.1.2=Толпа была в восторге от вашей запоминающейся песни о дворянине и его любовных неудачах. Возьмите **Книгу заклинания** «Чтение мыслей» и ордер на ваш арест. Чтение мыслей: _вы можете слышать поверхностные мысли ближайших существ. Длительное использование может привести к тому, что вы будете путать чужие мысли со своими собственными_.
background.jongleur.table.1.3=Ваш дебютный номер привел зрителей в бессвязное состояние; они бормотали о ярких существах, спускающихся с ночного неба. Позже вы заметили, что ноты напоминали звездные созвездия. Начните игру с **Книгой по астрономии** и множеством вопросов.
background.jongleur.table.1.4=Вы высмеяли забытого бога-обманщика и были за это прокляты. Теперь вы говорите только идеальными рифмами. Иронично, но это сделало вас еще более популярным среди коллег. Возьмите **Тезаурус (20 зм)**. Без него вы будете чувствовать _истощение_.
background.jongleur.table.1.5=Вы получили шрам в результате несчастного случая на сцене. Толпа аплодировала, думая, что это часть представления. Начните игру с поношенной **Сценической кольчугой** (Броня +1), запоминающимся шрамом и страхом перед аплодисментами.
background.jongleur.table.1.6=Ваши выдающиеся навыки кукловодства и имитации привели к тому, что вас обвинили в колдовстве (буквально) и изгнали. Возьмите зловещую **Ручную куклу** и **Кроличий череп** (_мелкий_), который защищает от чар.
background.jongleur.table.2.prompt=Какую безделушку вы не смогли оставить позади?
background.jongleur.table.2.1=**Фальшивые наручники** — Удобные, реалистичные наручники. Только вы знаете, как из них выбраться.
background.jongleur.table.2.2=**Карманный театр** — Набор маленьких кукол и складная сцена. Отлично подходит для быстрых отвлечений.
background.jongleur.table.2.3=**Призрачная скрипка** — Тёмно-серая скрипка, играющая навязчивую мелодию, которую повторяет невидимый, далёкий двойник.
background.jongleur.table.2.4=**Трагические рассказы** — Запрещённая в приличном обществе, эта книга становится менее непристойной и более душераздирающей к концу. Стоимость: **100 зм**.
background.jongleur.table.2.5=**Маска мифов** — Гипсовая маска, позволяющая принять облик монстра. После её снятия, добавьте одун **Усталость**.
background.jongleur.table.2.6=**Разбиваемый бокал** — Винный бокал, который можно разбить множество раз; он восстанавливается через 24 часа. Издаёт очень громкий звук.
background.kettlewright.table.1.prompt=Чем вы занимаетесь?
background.kettlewright.table.1.1=Вы создаете небольшие устройства для местных гильдий и не задаете лишних вопросов. Получите дополнительно **40 зм** и объявление о вашем розыске, с вашим лицом. Имея время и материалы, вы можете открыть почти любую дверь или сейф.
background.kettlewright.table.1.2=Вы торгуете товарами для дома и инструментами, предлагая свой товар жителям разных поселений. Возьмите **предметы на сумму 20 зм** из таблицы [снаряжения](/second-edition/players-guide/marketplace#gear). Вы свободно владеете жаргоном путешественников.
background.kettlewright.table.1.3=Вы были военным литейщиком, пока мир не разрушил ваш источник дохода. Возьмите **Литейный молот** (к10, _громоздкий_) и **Жестяной шлем** (Броня +1). Имея время и материалы, вы можете ремонтировать доспехи.
background.kettlewright.table.1.4=Вы продаете редкие и качественные товары как монастырям, так и дворянам. Возьмите **Подзорную трубу**, **Ожерелье** (_мелкий_) стоимостью 20 зм и свиток «Зеркальный путь» (_мелкий_). Зеркальный путь: _зеркало становится порталом к другому зеркалу, в которое вы смотрели сегодня_.
background.kettlewright.table.1.5=Вы предоставляете услуги по охране, незаметно отслеживая угрозы во время обмена денег. Начните игру с дополнительными **+1к4 к ОЗ**, **Длинным мечом** (к10, _громоздкий_) и **Стеганка** (+1 к броне).
background.kettlewright.table.1.6=Вы собираете жесть и железо с полей сражений, вырывая зубы из еще подергивающихся трупов. Начните игру с молодым **Ослом** (+4 слота, _медленный_), **Арбалетом** (к8, _громоздкий_) и **Пилой** (к6).
background.kettlewright.table.2.prompt=Что всегда выручает вас из беды?
background.kettlewright.table.2.1=**Огненные яйца** — Шесть небольших гранул из морской соли, древесины и керамической пыли. Они взрываются даже при небольшом нагреве (к8, _взрыв_), но пламя быстро гаснет.
background.kettlewright.table.2.2=**Черная смола** — Универсальна: легко воспламеняющаяся и липкая (3 использования).
background.kettlewright.table.2.3=**Шипованные ботинки** — Легко пробивают головы (к8), а также лед и грязь. Передвижение становится немного медленнее, но устойчивее.
background.kettlewright.table.2.4=**Паста мастера** — Запечатывает любое отверстие размером с кулак (3 использования).
background.kettlewright.table.2.5=**Фейерверки** — Ослепительное, хотя и опасное зрелище. Достаточно взрывчатого вещества, чтобы оторвать палец или два (осталось 2 использования).
background.kettlewright.table.2.6=**Кот-падальщик** — Хитрый питомец: достаточно маленький, чтобы спрятаться в вашем рюкзаке (_громоздкий_), но довольно сильный, чтобы отпугнуть мелких хищников. Требует одну порцию мяса в день. [3 ОЗ, 5 СИЛ, 15 ЛОВ, 12 ВОЛ].
background.marchguard.table.1.prompt=Почему вы принесли клятву?
background.marchguard.table.1.1=Ваша семья имеет давнюю традицию службы, и вас с раннего возраста обучали выживанию в дикой природе. При выполнении действия «Снабжение» ваш результат увеличивается на одну ступен (например, с 1к4 на 1к6).
background.marchguard.table.1.2=Вы были под приговором, и клятва стала для вас способом избежать наказания. Возьмите **Набор отмычек** и **Ключ** (_мелкий_) от безопасного дома.
background.marchguard.table.1.3=Родившись в знатной семье, вы присоединились к стражам, чтобы избежать семейных проблем. Возьмите украденную перед уходом из дома **Палатку из гусиного пуха** (вмещает двоих).
background.marchguard.table.1.4=Когда ваша семья потеряла все, вы принесли стражам клятву, чтобы не стать обузой. Начните игру с дополнительными **Пайками** (3 порции) и **Метательными ножами** (к6).
background.marchguard.table.1.5=Один из **стражей пограничья** спас вашу жизнь, и это вдохновило вас вступить в их ряды. Возьмите **Силок** и **Альбом для рисования**, заполненный детальными изображениями.
background.marchguard.table.1.6=У вас были темные времена и вы решили, что вашей жизни нужна цель. Вы все еще не уверены, было ли вступление в стражу правильным выбором. Возьмите **Непромокаемый плащ** и **Картографическую бумагу**.
background.marchguard.table.2.prompt=Что вы носите как символ своей клятвы?
background.marchguard.table.2.1=**Впечатляющий значок** — Металлический знак почета от стражи. Он может открывать двери, но оставляет след (_мелкий_).
background.marchguard.table.2.2=**Клятвенный компас** — Указывает не на север, а на ближайшего члена стражи пограничья. Также сообщает, когда они приближаются.
background.marchguard.table.2.3=**Притягивающие камни** — Два черных как смоль камня. Когда их разделяют, они всегда катятся друг к другу.
background.marchguard.table.2.4=**Огненная колба** — Удивительно вкусная смесь из крепкого алкоголя. При броске создает стену пламени высотой 10 фт, которая гаснет через несколько минут (1 использование).
background.marchguard.table.2.5=**Повязка боли** — Прикоснитесь к раненому существу, чтобы перенести его раны на себя (Обменяйте потерянные СИЛ с вашим значением СИЛ). **Перезарядка**: наденьте кольцо, будучи полностью здоровым. При этом вы потеряете  1 СИЛ навсегда (_мелкий_).
background.marchguard.table.2.6=**Бич браконьера** — Сильно пахнущие стрелы (3 использования). Запах достаточно стойкий, чтобы легко отследить местонахождение стрелы.
background.mountebank.table.1.prompt=Как была раскрыта ваша афера?
background.mountebank.table.1.1=Ваши «пациенты» сообщали о чудесных выздоровлениях, несмотря на отсутствие у вас медицинской подготовки. Начните игру с **Бинтами** (3 использования) и талантом к исцелению.
background.mountebank.table.1.2=После соблазнения богатого покровителя, его семья наняла банду преступников, чтобы вас найти. Вы сбежали и вынужденны скрываться. Начните игру с **Кремом красоты** (2 использования).  Нанесите его, чтобы выглядеть неотразимо в течение следующих 12 часов.
background.mountebank.table.1.3=Вы продавали поддельные пророчества, но когда одно из них сбылось, это привлекло нежелательное внимание. Сделайте бросок по таблице **Знамений** и сохраните результат в тайне. Начните игру со скрытым **Клинком** (к6, _мелкий_).
background.mountebank.table.1.4=Ваша выходка уничтожила бесценный артефакт и ранила дюжину зрителей. Начните игру с **Капитанской униформой** (_мелкий_), церемониальным мечом (безвредный, 60 зм) и **Букетом цветов**.
background.mountebank.table.1.5=Межевая ведьма прокляла вас за обман деревенских жителей. Магия работает непредсказуемо в ваших руках: пройдите спасбросок ВОЛ, чтобы избежать катастрофы. Если вы становитесь целью чужой магии, спасбросок должен пройти ее создатель.
background.mountebank.table.1.6=Ваши «сеансы» общения с мертвыми на самом деле были обманом с использованием скрытой от глаз **Книги заклинания** «Слуховая иллюзия». В конце концов, один из клиентов раскрыл ваш секрет. Начните игру с книгой заклинания и набором шарфов. Слуховая иллюзия: _вы создаете иллюзорные звуки, исходящие из выбранного вами направления. В качестве дополнительного эффекта после использования заклинания, книга издает случайные и порой неуместные звуки в течение дня._
background.mountebank.table.2.prompt=Какой сувенир может вас выдать?
background.mountebank.table.2.1=**Королевский герб** — Родившись в королевской семье, вы выбрали иной путь. Герб (_мелкий_) дает вам доступ, но также уведомляет семью о вашем местонахождении.
background.mountebank.table.2.2=**Чудо-масло** — Пахучая, скользкая смесь (2 использования).
background.mountebank.table.2.3=**Хирургическое мыло** — Брусок из щелочи и золы, временно делающий кожу прозрачной, обнажая анатомию (4 использования).
background.mountebank.table.2.4=**Козий порошок** — Получен из плаценты козленка. Временно излечивает любую болезнь, но симптомы возвращаются через несколько часов.
background.mountebank.table.2.5=**Проклятый сапфир** — Стоимость **200 зм**; заметно для окружающих возвращается в ваш карман вскоре после того, как вы его потратите. Вы не можете от него избавиться.
background.mountebank.table.2.6=**Алхимическое тату** — Собака, кошка или птица, способная покидать ваше тело по требованию. Она выполняет ваши команды по мере своих возможностей и может передавать вам свои ранения, например, потерю СИЛ (_мелкий_).
background.outrider.table.1.prompt=Какой личный кодекс или принцип вы соблюдаете?
background.outrider.table.1.1=**Не проливать кровь невинных**: ни один случайный свидетель не пострадает под вашей защитой. Возьмите **Надежный баклер** (Броня +1). Держа этот  щит, вы не можете быть сдвинуты, пока обе ноги стоят на твердой почве.
background.outrider.table.1.2=**Чтите орудия смерти**: оружие должно уважаться и содержаться в порядке. Возьмите **Оселок из вирмовой кости**. Вы совершаете получасовой ритуал заточки. Ваши атаки оружием считаются _усиленными_ до тех пор, пока не будет нанесен урон СИЛ.
background.outrider.table.1.3=**На встречу смерти**: вы никогда не отступаете, независимо от шансов. Возьмите **Смерть-свисток** с 1 зарядом. Его звук пугает всех, кто его слышит (спасбросок ВОЛ или бегство). **Перезарядка**: уловите последний вздох умирающего воина.
background.outrider.table.1.4=**Чтите мертвых**: смерть — это путь, который проходят все, и он заслуживает уважения. Возьмите **дополнительные 30зм**. Вы всегда кладете две золотые монеты на веки убитого врага. Каким-то образом, они всегда есть у вас под рукой.
background.outrider.table.1.5=**Верность делу**: ваше слово — ваша клятва. Приняв задание, вы доводите его до конца. Возьмите **Счетную палочку**. Когда на ее поверхности отмечается клятва—палочка затвердевает (к8) и остается такой, пока клятва не будет выполнена. Если клятва нарушена, палочка ломается пополам.
background.outrider.table.1.6=**Всегда платите по счетам**: вы всегда возвращаете то, что должны, как монеты, так и услуги. Вы ожидаете того же от других. Возьмите **Книгу учета** с отметками о выполненных обязательствах, затем сделайте еще один бросок по таблице Связей.
background.outrider.table.2.prompt=Какой породы ваша лошадь?
background.outrider.table.2.1=**Тяжелый дестриэ** — Внушительное животное, словно созданное для войны [8 ОЗ, Броня 1, копыта (к10+к10), +2 слота].
background.outrider.table.2.2=**Черноногий дэнди** — Выносливый и адаптивный. **Трудная** или _опасная_ местность становится на одну ступень легче [6 ОЗ, +4 слота].
background.outrider.table.2.3=**Речнозуб** — Впечатляюще сильный, способен нести тяжелые грузы [4 ОЗ, +6 слотов / только +2 слота, если везет двух человек].
background.outrider.table.2.4=**Пегий коб** — Умный, понимает простые команды и даже чувствует опасность [6 ОЗ, +4 слота].
background.outrider.table.2.5=**Липовый белый** — Тренированный и ловкий, способен выполнять сложные маневры в критические моменты, не требуется спасбросок ЛОВ для бегства [4 ОЗ, +3 слота].
background.outrider.table.2.6=**Бродячий туманник** — Дикий, но очень быстрый, даже в _трудной_ местности. Легкий в управлении [4 ОЗ, +2 слота].
background.prowler.table.1.prompt=На кого вы охотились в последний раз?
background.prowler.table.1.1=**Светлячок-Иммитатор**, приманивающее рыбаков своим мерцанием.  Вы потеряли конечность в схватке с ним и заменили ее на алхимический протез (к8, _мелкое_ при ношении). Протез устойчив к нагреву и ядам, но требует ежедневной смазки. В комплекте — **Масленка** (6 использований).
background.prowler.table.1.2=**Ледяная крапива**, хватающая и выпивающая кровь овец.  Вы потеряли свою награду, когда распыленный вами грибок уничтожил половину стада. Но теперь у вас есть **Семя ледяной крапивы**, которое замораживает любой водоем независимо от размера. Не употребляйте его внутрь (1 использование).
background.prowler.table.1.3=**Серебряный болотный ползун**, убивший кого-то из ваших близких. Теперь вы носите его **Зуб** (мелкий) на цепочке вокруг шеи как предупреждение для его сородичей. _Зуб мягко гудит, когда за вами кто-то следит_.
background.prowler.table.1.4=**Обозленный лесной дух**, отравивший усадьбу. Вы спасли **сердечное семя** из корней умирающего дерева. Посадите его, чтобы вырастить новый лес. Также у вас есть **Железные наручи** (Броня +1, _громоздкий_).
background.prowler.table.1.5=**Пустотелый волк**, нападавший на путников. Вы сжалились и выходили это изголодавшее существо. Теперь он предан вам до смерти, а еще он отлично роет туннели. [5 ОЗ, 11 СИЛ, 13 ЛОВ, 8 ВОЛ, зубы (к6)].
background.prowler.table.1.6=**Лазурная камышовка**. Ее гаметы при правильном извлечении приносят огромную прибыль. Вы преуспели, но оставили гнездо на съедение волкам. У вас есть **Разделочный нож** (к6), дополнительные **20 зм** и чувством вины.
background.prowler.table.2.prompt=Какой инструмент всегда в вашем рюкзаке?
background.prowler.table.2.1=**Забродивший спирт** — Согревает в лучшие времена и может стать взрывчаткой в худшие (3 использования).
background.prowler.table.2.2=**Следоискатель** — Шумный инструмент, выявляющий поблизости тропы, даже глубоко скрытые.
background.prowler.table.2.3=**Успокаивающий бальзам** — Восковой брусок. Если прокипятить в воде, пар действует как снотворное средство.
background.prowler.table.2.4=**Клин и кабель** — Для преодоления сложной местности или создания самодельных ловушек и сооружений.
background.prowler.table.2.5=**Железная погремушка** — Шумелка для отвлечения или отпугивания добычи. Звучит убедительно, как змея.
background.prowler.table.2.6=**Затвердевающий клей** — Делает любой плоский материал (ткань, кожу, песок) твердым как камень. Дорогостоящий (20 зм за бутылку, 3 использования).
background.rill-runner.table.1.prompt=Какими песнями вы наиболее известны?
background.rill-runner.table.1.1=**Тустеп жестянщика**. Веселая сказка о страннике, раздающем подарки. Возьмите **Тростниковый свисток**. Все, кто его услышит, должны пройти проверку ВОЛ, перед совершением акта насилия.
background.rill-runner.table.1.2=**Сильф и ее возлюбленный**. Непристойная история о потерянной любви. Возьмите **Узелок ветра** (3 заряда). Создает сильный ветер. **Перезарядка**: привяжите узелок к мачте во время шторма.
background.rill-runner.table.1.3=**Преданность арфиста**. Грустная короткая история о музыканте, влюбившемся в звезду. Возьмите **Небесную лютню**. Показывает созвездия над головой, независимо от погоды.
background.rill-runner.table.1.4=**Ловец тростника**. Известная песня о гигантском карпе, который всегда ускользает. Возьмите **Моток речной бечевки** (5 использований). Каждое погружение в реку гарантирует улов, хотя он может быть неприятным.
background.rill-runner.table.1.5=**Песня серебряного ручья**. Безмолвная колыбельная, имитирующая звук текущей воды. Возьмите **Каменную флейту**, способной успокоить почти любую реку.
background.rill-runner.table.1.6=**Дрозд на лугу**. Меланхоличная история, рассказанная хором сменяющихся голосов. Возьмите **Гусиное перо** (1 использование, мелкое). Карта, нарисованная этим пером, показывает самый быстрый путь между двумя точками.
background.rill-runner.table.2.prompt=Как вы добываете деньги на оплату ваших путешествий?
background.rill-runner.table.2.1=**Концерты** — Выступления в тавернах всегда обеспечивают вас жильем и едой, иногда даже чаевыми! Начните игру с дополнительными 1к6 зм.
background.rill-runner.table.2.2=**Охрана** — Вы защищаете тех, кто боится путешествовать в одиночку. Возьмите Рапиру (к8).
background.rill-runner.table.2.3=**Торговля** — Вы покупаете дешево и продаете дорого, зарабатывая себе на жизнь торговлей. Возьмите **Один предмет** стоимостью до 20 золотых из таблицы снаряжения.
background.rill-runner.table.2.4=**Перевозка** — Вы доставляете «деликатные» посылки по всей земле. У вас есть как минимум один контакт в любом крупном городе.
background.rill-runner.table.2.5=**Друг моряков** — Сквозь бурные воды и опасные ветра вы всегда обеспечиваете прибытие корабля к месту назначения. Для вас проезд всегда бесплатен.
background.rill-runner.table.2.6=**Проводник** — Вы сопровождаете путешественников и караваны по заболоченным землям. Возьмите **Карту** (_мелкий_), относящейся к вашему следующему путешествию.
background.scrivener.table.1.prompt=Какую книгу вы носите при себе?
background.scrivener.table.1.1=**Дикий язык**. Сборник свитков в кожаном переплете. Фундаментальный труд, каталогизирующий скрытые языки животных и способы их понимания.
background.scrivener.table.1.2=**Безмолвная симфония**. Книга в флуоресцентной обертке. Очень редкая, описывает тонкие знаки, используемые практикующими магию невидимости.
background.scrivener.table.1.3=**Трактат о Бездне**. Неописуемая черная книга. Глубокий, в основном теоретический труд, описывающий Корни, а также информацию о расположении ближайших Врат.
background.scrivener.table.1.4=**Звездный вальс**. Переплет из тонкой кожи с застежкой в форме кометы. Детализированные астрономические карты, небесные движения и звездные фестивали. Высоко ценится (**100 зм**) за полезность для путешественников.
background.scrivener.table.1.5=**Собор и Крона**. Переплет из крупных листьев поверх пергамента. Номинально детская книга, но на полях содержится информация о путешествиях, питании и ночлеге в облачных лесах.
background.scrivener.table.1.6=**Стеклянный сад**. Спрятана под обложкой другой книги. Еретический труд, описывающий материалы, процедуры и оптимальные места для открытия Врат.
background.scrivener.table.2.prompt=Как вы записываете конфиденциальную информацию?
background.scrivener.table.2.1=**Чернила правды** — Светятся при написании истинных утверждений, но исчезают, если написать ложь.
background.scrivener.table.2.2=**Камень-шифратор** — Пара острых черных камней. Каждый из них расшифровывает любое сообщение, написанное другим.
background.scrivener.table.2.3=**Вечное перо** — Перо, которое пишет на любой поверхности. Однако вам все равно нужна чернильница (_мелкий_).
background.scrivener.table.2.4=**Флакон шепота** — Прошепчите сообщение во флакон, и он воспроизведет его тому, кто откроет его следующим.
background.scrivener.table.2.5=**Кровавая линза** — Извлекает кровь из цели без ее ведома. Капля, помещенная на глаз, раскрывает воспоминания за последний день.
background.scrivener.table.2.6=**Лист эха** — Пустой пергамент (_мелкий_). Тот, кто его разворачивает, видит свои действия за день, медленно проявляющиеся в плотном почерке.
