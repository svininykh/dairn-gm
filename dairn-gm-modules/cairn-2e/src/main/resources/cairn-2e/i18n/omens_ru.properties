omen.1=Воды некогда полноводной и дарующей жизнь реки почернели и стали зловонными, отравляя землю и вызывая болезни у тех, кто пьет из нее. Старейшина деревни указывает на недавнее осквернение как на причину, но большинство не прислушивается к его словам.
omen.2=В этом году зима наступила слишком быстро: морозы и снегопады появились гораздо раньше, чем ожидалось. Говорят, что узоры инея на окнах, прудах и трещинах в земле напоминают карту.
omen.3=Густой, неестественный туман начал окутывать священную рощу. Говорят, это дело рук великого лесного духа, разгневанного вырубкой близлежащих лесов.
omen.4=Ночное небо с каждым вечером становится все темнее, словно звезды исчезают одна за другой. Слухи о демонических существах, похищающих фермеров и утаскивающих их под самые Корни, распространяются как лесной пожар. Старейшины деревни считают, что эти события связаны между собой.
omen.5=Певчие птицы Леса в последнее время зловеще умолкли. Охотники утверждают, что видели призрачную фигуру, блуждающую по чаще и с тоской смотрящую на каждого встречного.
omen.6=Странные, слезообразные камни были найдены по всему региону, вызвав своего рода «золотую лихорадку» среди ювелиров и воров. Местные жители верят, что это слезы самой земли, оплакивающей грядущую трагедию.
omen.7=Рои вредителей нарушают спокойствие снов, а фермеры говорят о громком жужжании, исходящем из глубин Леса. Они также уверены, что этот звук становится все ближе.
omen.8=Есть деревня, известная своим впечатляющим «материнским древом», которое, как говорят, хранит секреты города в своих ветвях. Недавно оно начало истекать красным соком, что беспокоит старейшин.
omen.9=Луна окрасилась в багровый, и теперь заливает ночь зловещим, кроваво-красным светом. Некоторые говорят, что это предвещает время хаоса и раздора, так как границы между Лесом и миром смертных становятся тоньше.
omen.10=В ночном небе появились странные трещины, расползающиеся клубящимися вихрями света и цвета. Некоторые утверждают, что границы миров сейчас наиболее тонки, и боятся того, что может появиться с другой стороны.
omen.11=Ночной цветок, считавшийся вымершим, снова распространился по всему Лесу. Его аромат опьяняюще прекрасен, но также вызывает яркие кошмары.
omen.12=Местный скот в последнее время стал все более беспокойным и неуправляемым. Старый пастух говорит, что это из-за тревожного воя, исходящего из Леса каждое полнолуние.
omen.13=Рои насекомых массово покидают Лес, разрушая все деревянные строения на своем пути. Звук от их крыльев напоминает знакомую мелодию, когда они пролетают над головой, словно забытый детский стишок.
omen.14=Охотники говорят о проклятии, которое постигает каждого, кто убивает зверя с белой шерстью: вскоре их находят мертвыми в своих домах. С каждым днем зверей для охоты становится все меньше и меньше.
omen.15=Говорят, что из колодцев по всему городу доносится слабый смех, который ночью превращается в рыдания.
omen.16=Созвездия медленно начинают смещаться в ночном небе, образуя незнакомые узоры, что озадачивает астрономов и мудрецов. Даже животные кажутся обеспокоенными.
omen.17=Древнее дерево в самом сердце тихой деревни внезапно засохло и погибло, несмотря на отсутствие признаков болезни. После того как его ствол был разрезан, в сердцевине нашли окровавленную руку.
omen.18=Статуи плачут кровью уже несколько месяцев подряд, и в деревне не рождаются дети. Единственный ребенок стал исключением, и старейшины, охваченные страхом и ужасом, спрятали его.
omen.19=Местная фауна ведет себя странно, проявляя повышенную агрессию или полностью покидая обжитые места. Охотники говорят о теневой фигуре, бродящей по Лесу и призывающей животных.
omen.20=В последние недели приграничные города стали бунтовать после заявлений о том, что их детям во снах является фигура в красном и произносит одно и то же предупреждение: «Грядет огонь, что поглотит все.»
