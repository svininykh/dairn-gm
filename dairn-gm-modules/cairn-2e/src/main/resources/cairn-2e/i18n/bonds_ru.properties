bond.19=Вам приснилась белая ворона с веточкой в клюве. Проснувшись на следующее утро, вы обнаружили эту **Веточку** (_мелкий_) у себя в руке. Веточка слегка пахнет серой, но вы верите, что она приносит удачу.
bond.20=Один из ваших предков обидел **Моховую ведьму**, и она прокляла ваш род. Ваше отражение заставляет зеркала разбиваться вдребезги. Вы заметили, что осколки иногда могут развеять иллюзии.
