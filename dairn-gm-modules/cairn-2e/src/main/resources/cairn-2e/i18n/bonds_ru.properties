bond.1=Вы унаследовали **самоцвет** (500 золотых, холодный и хрупкий) от давно умершего родственника. Вместе с ним пришло предупреждение: если растратите это неожиданное богатство, будет востребован долг, о котором давно забыли.
bond.2=Дальний родственник оставил вам небольшое наследство: 20 золотых и **странный компас** (_мелкий_), который всегда указывает на нечто глубоко в Лесу.
bond.3=Вы носите с собой нарисованный от руки **портрет любимого человека** (_мелкий_), который давно исчез в Лесу. Каким-то образом вы знаете, что он еще жив.
bond.4=Вы обнаружили крошечную **хрустальную призму** (_мелкий_), зарытую в земле. Когда вы подносите ее к свету, внутри возникает образ неизвестного вам места глубоко в Лесу. Иногда вам кажется, что нечто смотрит на вас в ответ.
bond.5=Однажды вы освободили наяду из пересохшего ручья. В благодарность она подарила **серебряный мох** (_мелкий_). Если проглотить его рядом с водоемом, наяда придет к вам один раз, чтобы вернуть долг.
bond.6=Вы унаследовали **старый дневник**, переплетенный корой. Каждый вечер его страницы заполняются событиями дня, описанными с точки зрения самого дневника. Слог изложения груб, но правдив.
bond.7=Вы храните давнюю семейную тайну, приняв в наследство **половину древнего ключа** (_мелкий_). Говорят, если соединить его с другой половиной, он поможет пройти через любую дверь, используя **Врата**.
bond.8=Вы получили **письмо** (_мелкий_), содержащее неоспоримые доказательства вашего происхождения от фейской знати. В нем также указаны дата и место встречи с автором письма, глубоко в Лесу.
bond.9=Вы имеете значительный долг перед представителем знати и носите его **перстень с печаткой** (_мелкий_). Он служит как символом покровительства, так и вашей обязанности.
bond.10=Вы поглотили **озорного духа**, голос которого теперь звучит внутри вас и причиняет беспокойство. Он требует возвращения домой, глубоко в Лес, занимает один слот инвентаря, но ежедневно поглощает одну **Усталость**. Пока что ему выгодно, чтобы вы были живы.
bond.11=Бродячий рассказчик поведал вам историю о великом сокровище, спрятанном глубоко в Лесу. Вы считали это вымыслом, пока он не вручил вам **свернутую карту** (_мелкий_) с отметкой «X».
bond.12=Во время странствий вы встретили умирающего охотника, который попросил вас передать сообщение своим близким. У вас есть **письмо** (_мелкий_), запечатанное древесной смолой. Оно адресовано **Владыке Зимы**.
bond.13=Вы обнаружили раненое существо в Лесу, но решили не помогать ему. Теперь оно повсюду преследует вас, появляясь только когда вы одни. Оно выглядит печальным, но не злым. Вы не можете впасть в _панику_, действуя в одиночку.
