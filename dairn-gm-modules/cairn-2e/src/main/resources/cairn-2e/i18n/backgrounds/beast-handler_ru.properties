background.beast-handler.table.1.prompt=На каких существах вы специализируетесь?
background.beast-handler.table.1.1=**Паукообразные** — Возьмите **Воспламеняющий жезл** и **Масленку** (6 использований). Они способны уничтожить большое паучье гнездо за считанные секунды.
background.beast-handler.table.1.2=**Кошачьи** — Возьмите мешок с **Ус-травой**. Ее запах может успокоить и подчинить даже самых крупных кошек.
background.beast-handler.table.1.3=**Псовые** — Возьмите венок из **Аконита** и **Большую сеть**. Также эффективно против оборотней!
background.beast-handler.table.1.4=**Птицы** — Возьмите **Манок** (3 заряда). Он может имитировать любой птичий крик и также использоваться для передачи простых сообщений. **Перезарядка**: покормите птенца, как это сделала бы его мать, а затем подуйте в свисток.
background.beast-handler.table.1.5=**Грызуны** — Возьмите **Флейту Пана**, издающий высокочастотный звук, который слышат только грызуны. Пока вы играете, они будут следовать за вами, даже к собственной гибели.
background.beast-handler.table.1.6=**Змеи** — Возьмите **Согревающий камень**, излучающий тепло и привлекающий змей, а также **Противоядие** (2 использования).
background.beast-handler.table.2.prompt=Что понимают дикие существа, но не осознают ваши сородичи?
background.beast-handler.table.2.1=Мир гораздо глубже, чем кажется. Сосредоточившись в тишине, вы можете заимствовать чувства ближайшего существа вашей **специализации**.
background.beast-handler.table.2.2=Поведение зверей — это язык. Наблюдая за существами вашей **специализации**, вы получаете знания о погодных условиях и надвигающихся катастрофах.
background.beast-handler.table.2.3=Охота — это пульс жизни. Вы чувствуете присутствие хищников, даже если они не относятся к вашей **специализации**.
background.beast-handler.table.2.4=Вы знаете эти земли как свои пять пальцев. Ваш шанс заблудиться в местности, где доминируют существа вашей **специализации**, уменьшается на одну ступень (например, с 4-из-6 до 3-из-6).
background.beast-handler.table.2.5=Природная симфония слышна тем, кто способен настроиться. Когда вы окружены существами своей **специализации**, они могут предупредить вас о приближении опасности.
background.beast-handler.table.2.6=Выживание — это адаптация. Один раз в день вы можете заимствовать простую особенность существа вашей **специализации** (например, перепонки на пальцах, ночное зрение и т. д.). Добавьте одну **Усталость** за каждое использование.
