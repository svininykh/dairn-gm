background.cutpurse.table.1.prompt=Какое было ваше последнее крупное дело?
background.cutpurse.table.1.1=Летний домик дворянина. В этом месте было полно изысканного вина (+20 зм), но больше ничего ценного. Возьмите **Кусачки для проволоки**.
background.cutpurse.table.1.2=Банк (вас поймали). На вас есть клеймо, видимое только при свете огня, и любой, кто увидит клеймо, может попросить у вас пива. Возьмите **Катушку с проводом**.
background.cutpurse.table.1.3=Склад гильдии. Возьмите **Лестницу** (_громоздкий_, 10 фт) и **Ослепляющий порошок** (1 использование).
background.cutpurse.table.1.4=Ростовщик. Кто-то опередил вас, но оставил **свиток** «Магический глаз» (_мелкий_). **Магический глаз**: _вы можете видеть через парящий магический глаз, который летает неподалеку и перемещается по вашей команде._
background.cutpurse.table.1.5=Комната констебля. Вы сбежали, но бросили друзей позади. Начните игру с **Прочной шелковой веревкой** и ощущением тошноты от своего поступка.
background.cutpurse.table.1.6=Университет. Вас заметили, но не преследовали. Вы до сих пор не знаете, почему. Возьмите **Дымовые бомбы** (3 использования).
background.cutpurse.table.2.prompt=Что помогает вам воровать??
background.cutpurse.table.2.1=**Кольцо-кошки** — 2 заряда. Позволяет взбираться по стенам и безопасно падать. **Перезарядка**: наденьте кольцо на хвост бездомной кошки.
background.cutpurse.table.2.2=**Золотой палец** — 1 заряд. Накладка на палец, имитирующая любой обычный ключ. **Перезарядка**: оставьте ее на ночь вместе с не менее чем 100 зм.
background.cutpurse.table.2.3=**Стекло подглядывания** — 3 использования. Монокль, позволяющий видеть сквозь стены или другие преграды. Разбивается после последнего использования.
background.cutpurse.table.2.4=**Сладкий свисток** — 1 заряд. Окружающие слышат мягкий знакомый голос вдалеке. Они следуют за ним, не в силах сопротивляться. **Перезарядка**: потеряйте дорогое воспоминание (опишите его).
background.cutpurse.table.2.5=**Покров бродяги** — 1 заряд. Наденьте его, чтобы незаметно слиться с толпой, выглядя как простой нищий. **Перезарядка**: пожертвуйте весь дневной заработок бедным. _Мелкий_ предмет.
background.cutpurse.table.2.6=**Обратный тетотум** — 1 использование. При вращении, отматывает время на 30 секунд назад. Все помнят,  что произошло.
