background.bonekeeper.table.1.prompt=What did you take from the dead?
background.bonekeeper.table.1.1=A **crow-shaped amulet**. You can ask a question of the dead but must add a **Fatigue** each time. They do not always speak truthfully.
background.bonekeeper.table.1.2=A **mortal wound** from a freed _revenant_. You were healed, but the disfigurement has made you a pariah. You require neither air nor sustenance but are still subject to pain and death. Trapped between worlds, the dead see you as one of their own.
background.bonekeeper.table.1.3=A **Blood Pail** (_bulky_) from a local death-cult. Empty it to raise a servant built from whatever is buried below, with 6 HP, 1 Armor, 13 STR, 11 DEX, 4 WIL, and shard fists (d8+d8). Only one servant can be raised at a time. If destroyed, you permanently lose 1d4 STR. **Recharge**: Fill with the blood of a dying warrior.
background.bonekeeper.table.1.4=A **burial wagon** (+6 slots, _slow_) from your last job. It came with a stubborn old **donkey** (+4 slots, only +2 slots if pulling wagon).
background.bonekeeper.table.1.5=The **Detect Magic** Spellbook, stolen from an ancient library. Your family worked in service to an obscure underworld deity, but you lost your faith. Though exiled, you continue to serve, even as an apostate. Detect Magic: You can see or hear nearby magical auras. _Becomes warm to the touch when magic is used nearby._
background.bonekeeper.table.1.6=A **plague doctor's mask**, after its owner succumbed to the disease that wiped out everyone you once knew. They should have kept it on.
background.bonekeeper.table.2.prompt=What tool was invaluable in your work?
background.bonekeeper.table.2.1=**Manacles** — Though old, it's still effective even against the very strong. You don't have the key.
background.bonekeeper.table.2.2=**Sponge** — Supposedly made from the remains of a rare sea creature. It never seems to dry out.
background.bonekeeper.table.2.3=**Pulley** — Great for moving gravestones, rocks, or even bodies.
background.bonekeeper.table.2.4=**Incense** — Perfect for rituals or to keep the flies at bay. Cools the blood.
background.bonekeeper.table.2.5=**Crowbar** — d6 damage. Sometimes you just need to get the damn thing open!
background.bonekeeper.table.2.6=**Repellent** — Powerful stuff. Its faded label makes it unclear what it is actually _meant_ to repel, though. Perhaps everything. 3 uses.
