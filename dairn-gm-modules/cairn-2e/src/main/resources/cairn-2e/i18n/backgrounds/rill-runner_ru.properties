background.rill-runner.table.1.prompt=Какими песнями вы наиболее известны?
background.rill-runner.table.1.1=**Тустеп жестянщика**. Веселая сказка о страннике, раздающем подарки. Возьмите **Тростниковый свисток**. Все, кто его услышит, должны пройти проверку ВОЛ, перед совершением акта насилия.
background.rill-runner.table.1.2=**Сильф и ее возлюбленный**. Непристойная история о потерянной любви. Возьмите **Узелок ветра** (3 заряда). Создает сильный ветер. **Перезарядка**: привяжите узелок к мачте во время шторма.
background.rill-runner.table.1.3=**Преданность арфиста**. Грустная короткая история о музыканте, влюбившемся в звезду. Возьмите **Небесную лютню**. Показывает созвездия над головой, независимо от погоды.
background.rill-runner.table.1.4=**Ловец тростника**. Известная песня о гигантском карпе, который всегда ускользает. Возьмите **Моток речной бечевки** (5 использований). Каждое погружение в реку гарантирует улов, хотя он может быть неприятным.
background.rill-runner.table.1.5=**Песня серебряного ручья**. Безмолвная колыбельная, имитирующая звук текущей воды. Возьмите **Каменную флейту**, способной успокоить почти любую реку.
background.rill-runner.table.1.6=**Дрозд на лугу**. Меланхоличная история, рассказанная хором сменяющихся голосов. Возьмите **Гусиное перо** (1 использование, мелкое). Карта, нарисованная этим пером, показывает самый быстрый путь между двумя точками.
background.rill-runner.table.2.prompt=Как вы добываете деньги на оплату ваших путешествий?
background.rill-runner.table.2.1=**Концерты** — Выступления в тавернах всегда обеспечивают вас жильем и едой, иногда даже чаевыми! Начните игру с дополнительными 1к6 зм.
background.rill-runner.table.2.2=**Охрана** — Вы защищаете тех, кто боится путешествовать в одиночку. Возьмите Рапиру (к8).
background.rill-runner.table.2.3=**Торговля** — Вы покупаете дешево и продаете дорого, зарабатывая себе на жизнь торговлей. Возьмите **Один предмет** стоимостью до 20 золотых из таблицы снаряжения.
background.rill-runner.table.2.4=**Перевозка** — Вы доставляете «деликатные» посылки по всей земле. У вас есть как минимум один контакт в любом крупном городе.
background.rill-runner.table.2.5=**Друг моряков** — Сквозь бурные воды и опасные ветра вы всегда обеспечиваете прибытие корабля к месту назначения. Для вас проезд всегда бесплатен.
background.rill-runner.table.2.6=**Проводник** — Вы сопровождаете путешественников и караваны по заболоченным землям. Возьмите **Карту** (_мелкий_), относящейся к вашему следующему путешествию.
