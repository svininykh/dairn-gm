background.aurifex.table.1.prompt=What went horribly wrong?
background.aurifex.table.1.1=There was an explosion, and you lost your sense of smell. Well, almost: you can sniff out gold as a pig does truffles. Take a **Tin of Snuff** (6 uses) to dampen the impact. Use it every day or become _deprived_.
background.aurifex.table.1.2=You dematerialized a beloved pet. Now it follows you around, invisible but always present. Although it cannot interact with the physical realm, you are able to share its senses. (Add a **Fatigue** each time.) It follows basic commands.
background.aurifex.table.1.3=You were exposed to a long-acting truth serum whose effects have yet to wear off. The disorder has its advantages: you cannot repeat lies you've heard, either.
background.aurifex.table.1.4=You were adept at creating _fake_ gold, which is almost as good. Eventually, your ruse was discovered, and you had to make a hasty retreat. Take a heavy **Metal Ingot** and **Gold Powder** (3 uses).
background.aurifex.table.1.5=Your alchemical recipe worked, but a rival stole the blueprint before your claims could be proven. Take a prototype **Blunderbuss** (d12, _blast_, _bulky_) that takes one round to reload, and a taste for revenge.
background.aurifex.table.1.6=Ridiculed for discovering how to turn gold into _lead_, you were a laughing stock. Take a bottle of **Universal Solvent** (2 uses) that dissolves anything it touches into its constituent parts.
background.aurifex.table.2.prompt=What alchemical marvel is the product of your latest ingenuity?
background.aurifex.table.2.1=**Pyrophoric Gel** — A sticky green fluid that catches fire when exposed to air, then burns for 8 hours. Cannot be extinguished (1 use).
background.aurifex.table.2.2=**Blast Sphere** — A head-sized iron ball filled with explosive powder that detonates on impact (d12, _blast_, _bulky_, 1 use).
background.aurifex.table.2.3=**Aqua Vita** — Purifies any liquid, converting it to pure water. Drinking it cures 1d6 STR (1 use).
background.aurifex.table.2.4=**Mimic Stone** — Records a short phrase that can later be played back.
background.aurifex.table.2.5=**Spark Dust** — Ignites easily and quickly. Useful for starting a fire or as an incendiary device (3 uses).
background.aurifex.table.2.6=**Homunculus** — A miniature clay replica of yourself that follows your every command. It hates being enthralled to you and complains bitterly whenever possible. Any damage done to the homunculus is also done to you. 3 HP, 4 STR, 13 DEX, 5 WIL
