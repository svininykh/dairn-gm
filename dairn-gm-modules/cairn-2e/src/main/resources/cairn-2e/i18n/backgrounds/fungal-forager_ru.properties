background.fungal-forager.table.1.prompt=Какой странный гриб вы обнаружили?
background.fungal-forager.table.1.1=**Кричащая труба**. При воздействии света издает такой громкий крик, что все ближайшие атаки (включая ваши собственные) становятся _ослабленными_ (2 использования).
background.fungal-forager.table.1.2=**Факельный гриб**. При раздавливании излучает холодный синий свет в течение короткого времени (2 использования).
background.fungal-forager.table.1.3=**Убийственный трюфель**. Резкий, высокотоксичный и очень редкий (можно продать убийцам за 50 зм). Практически везде считается вне закона (1 использование).
background.fungal-forager.table.1.4=**Чертовка**. Воздействие ее аромата вызывает сильную тошноту, вплоть до рвоты. Тем не менее, превосходно очищает помещение. Хранится в бутылке (1 использование).
background.fungal-forager.table.1.5=**Чашечный росток**. При употреблении уменьшает вас до размеров мыши, вещи остаются прежнего размера. Вы возвращаетесь к нормальному виду в течение часа, процесс проходит рывками (1 использование).
background.fungal-forager.table.1.6=**Корневой цветок**. Белый гриб, встречающийся лишь на трупах, зарытых глубоко в землю. При употреблении восстанавливает 1к6 ВОЛ. Вам будут сниться мертвецы и их история (1 использование).
background.fungal-forager.table.2.prompt=Что помогает вам сохранять рассудок даже в полной темноте?
background.fungal-forager.table.2.1=**Светящийся улитка** — Излучает мягкий биолюминесцентный свет. Питается одной порцией пищи каждые два дня.
background.fungal-forager.table.2.2=**Шаль Шелкового Мотылька** — Водонепроницаемое одеяло, способное потушить огонь без повреждений.
background.fungal-forager.table.2.3=**Молочный цветок** — Легкий стимулятор. Жевание делает вас невосприимчивым к _панике_ на следующий час (3 использования).
background.fungal-forager.table.2.4=**Светокомпас** — Тихо гудит по мере приближения к солнцу. Со временем шум становится невыносимо громким.
background.fungal-forager.table.2.5=**Ленивый тент** — Прочный и водонепроницаемый материал, пригодный для подвешивания на деревьях. Когда вы внутри, получаете +1 к броне.
background.fungal-forager.table.2.6=**Шахтерская смазка** — Отлично подходит для высвобождения драгоценного камня, инструмента или конечности из узкой щели. Крайне взрывоопасна (3 использования).
