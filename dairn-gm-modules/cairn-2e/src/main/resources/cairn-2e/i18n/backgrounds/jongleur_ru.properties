background.jongleur.table.1.prompt=Что произошло на вашем последнем выступлении?
background.jongleur.table.1.1=Несмотря на вашу подготовку в смертельных искусствах, один из актеров погиб, и вас обвинили в этом. Начните игру с легкой рапирой (к6) и фальшивой личностью.
background.jongleur.table.1.2=Толпа была в восторге от вашей запоминающейся песни о дворянине и его любовных неудачах. Возьмите **Книгу заклинания** «Чтение мыслей» и ордер на ваш арест. Чтение мыслей: _вы можете слышать поверхностные мысли ближайших существ. Длительное использование может привести к тому, что вы будете путать чужие мысли со своими собственными_.
background.jongleur.table.1.3=Ваш дебютный номер привел зрителей в бессвязное состояние; они бормотали о ярких существах, спускающихся с ночного неба. Позже вы заметили, что ноты напоминали звездные созвездия. Начните игру с **Книгой по астрономии** и множеством вопросов.
background.jongleur.table.1.4=Вы высмеяли забытого бога-обманщика и были за это прокляты. Теперь вы говорите только идеальными рифмами. Иронично, но это сделало вас еще более популярным среди коллег. Возьмите **Тезаурус (20 зм)**. Без него вы будете чувствовать _истощение_.
background.jongleur.table.1.5=Вы получили шрам в результате несчастного случая на сцене. Толпа аплодировала, думая, что это часть представления. Начните игру с поношенной **Сценической кольчугой** (Броня +1), запоминающимся шрамом и страхом перед аплодисментами.
background.jongleur.table.1.6=Ваши выдающиеся навыки кукловодства и имитации привели к тому, что вас обвинили в колдовстве (буквально) и изгнали. Возьмите зловещую **Ручную куклу** и **Кроличий череп** (_мелкий_), который защищает от чар.
background.jongleur.table.2.prompt=Какую безделушку вы не смогли оставить позади?
background.jongleur.table.2.1=**Фальшивые наручники** — Удобные, реалистичные наручники. Только вы знаете, как из них выбраться.
background.jongleur.table.2.2=**Карманный театр** — Набор маленьких кукол и складная сцена. Отлично подходит для быстрых отвлечений.
background.jongleur.table.2.3=**Призрачная скрипка** — Тёмно-серая скрипка, играющая навязчивую мелодию, которую повторяет невидимый, далёкий двойник.
background.jongleur.table.2.4=**Трагические рассказы** — Запрещённая в приличном обществе, эта книга становится менее непристойной и более душераздирающей к концу. Стоимость: **100 зм**.
background.jongleur.table.2.5=**Маска мифов** — Гипсовая маска, позволяющая принять облик монстра. После её снятия, добавьте одун **Усталость**.
background.jongleur.table.2.6=**Разбиваемый бокал** — Винный бокал, который можно разбить множество раз; он восстанавливается через 24 часа. Издаёт очень громкий звук.
