background.kettlewright.table.1.prompt=Чем вы занимаетесь?
background.kettlewright.table.1.1=Вы создаете небольшие устройства для местных гильдий и не задаете лишних вопросов. Получите дополнительно **40 зм** и объявление о вашем розыске, с вашим лицом. Имея время и материалы, вы можете открыть почти любую дверь или сейф.
background.kettlewright.table.1.2=Вы торгуете товарами для дома и инструментами, предлагая свой товар жителям разных поселений. Возьмите **предметы на сумму 20 зм** из таблицы [снаряжения](/second-edition/players-guide/marketplace#gear). Вы свободно владеете жаргоном путешественников.
background.kettlewright.table.1.3=Вы были военным литейщиком, пока мир не разрушил ваш источник дохода. Возьмите **Литейный молот** (к10, _громоздкий_) и **Жестяной шлем** (Броня +1). Имея время и материалы, вы можете ремонтировать доспехи.
background.kettlewright.table.1.4=Вы продаете редкие и качественные товары как монастырям, так и дворянам. Возьмите **Подзорную трубу**, **Ожерелье** (_мелкий_) стоимостью 20 зм и свиток «Зеркальный путь» (_мелкий_). Зеркальный путь: _зеркало становится порталом к другому зеркалу, в которое вы смотрели сегодня_.
background.kettlewright.table.1.5=Вы предоставляете услуги по охране, незаметно отслеживая угрозы во время обмена денег. Начните игру с дополнительными **+1к4 к ОЗ**, **Длинным мечом** (к10, _громоздкий_) и **Стеганка** (+1 к броне).
background.kettlewright.table.1.6=Вы собираете жесть и железо с полей сражений, вырывая зубы из еще подергивающихся трупов. Начните игру с молодым **Ослом** (+4 слота, _медленный_), **Арбалетом** (к8, _громоздкий_) и **Пилой** (к6).
background.kettlewright.table.2.prompt=Что всегда выручает вас из беды?
background.kettlewright.table.2.1=**Огненные яйца** — Шесть небольших гранул из морской соли, древесины и керамической пыли. Они взрываются даже при небольшом нагреве (к8, _взрыв_), но пламя быстро гаснет.
background.kettlewright.table.2.2=**Черная смола** — Универсальна: легко воспламеняющаяся и липкая (3 использования).
background.kettlewright.table.2.3=**Шипованные ботинки** — Легко пробивают головы (к8), а также лед и грязь. Передвижение становится немного медленнее, но устойчивее.
background.kettlewright.table.2.4=**Паста мастера** — Запечатывает любое отверстие размером с кулак (3 использования).
background.kettlewright.table.2.5=**Фейерверки** — Ослепительное, хотя и опасное зрелище. Достаточно взрывчатого вещества, чтобы оторвать палец или два (осталось 2 использования).
background.kettlewright.table.2.6=**Кот-падальщик** — Хитрый питомец: достаточно маленький, чтобы спрятаться в вашем рюкзаке (_громоздкий_), но довольно сильный, чтобы отпугнуть мелких хищников. Требует одну порцию мяса в день. [3 ОЗ, 5 СИЛ, 15 ЛОВ, 12 ВОЛ].
