background.fletchwind.table.1.prompt=Как вы заслужили свой лук??
background.fletchwind.table.1.1=**Война**. Если вы атакуете первым, в первом раунде ваши выстрелы получают свойство взрыв.
background.fletchwind.table.1.2=**Соколиная охота**. У вас есть сокол, и он ест только живую добычу. [3 ОЗ, 5 СИЛ, 16 ЛОВ, 4 ВОЛ, когти (к6+к6), клюв (к8)].
background.fletchwind.table.1.3=**Охота**. При выполнении действия «Снабжение», ваша способность добывать **Пайки** увеличивается на **одну ступен** (например, 1к4 становится 1к6).
background.fletchwind.table.1.4=**Турниры**. Ваши атаки из лука становятся _усиленными_, если цель обездвижена.
background.fletchwind.table.1.5=**Тренировка**. Если вы атакуете первым, атаки в ближнем бою против вас _ослаблены_, пока вы не получите урон по СИЛ.
background.fletchwind.table.1.6=Разведка. При выполнении действия «Путешествие», ваше присутствие снижает шанс заблудиться на одну ступен (например, 4-из-6 становится 3-из-6).
background.fletchwind.table.2.prompt=Из какого дерева сделан ваш лук?
background.fletchwind.table.2.1=**Западный тис** (к6, _громоздкий_). Может использоваться в качестве оружия с дробящим уроном в ближнем бою (к6 урон). Шумный.
background.fletchwind.table.2.2=**Скальный дуб** (к8, _громоздкий_). Ваши выстрелы поразительно мощны. При нанесении **Критического Урона** что-то отрывается.
background.fletchwind.table.2.3=**Каменная сосна** (к6, _громоздкий_). Производит одну порцию **Липкой смолы** в день. Аккуратно, смола крайне взрывоопасна.
background.fletchwind.table.2.4=**Белый ясень** (к6, _громоздкий_). Может использоваться вместо щита в ближнем бою (Броня +1).
background.fletchwind.table.2.5=Полосатый бамбук (к6). Складной, занимает только один слот (но все равно требует обеих рук для использования).
background.fletchwind.table.2.6=**Ведьмин вяз** (к6, громоздкий). Защищает носителя от ядов и токсинов, пока он держит лук.
