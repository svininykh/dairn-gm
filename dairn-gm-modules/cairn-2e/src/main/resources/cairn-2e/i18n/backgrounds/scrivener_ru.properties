background.scrivener.table.1.prompt=Какую книгу вы носите при себе?
background.scrivener.table.1.1=**Дикий язык**. Сборник свитков в кожаном переплете. Фундаментальный труд, каталогизирующий скрытые языки животных и способы их понимания.
background.scrivener.table.1.2=**Безмолвная симфония**. Книга в флуоресцентной обертке. Очень редкая, описывает тонкие знаки, используемые практикующими магию невидимости.
background.scrivener.table.1.3=**Трактат о Бездне**. Неописуемая черная книга. Глубокий, в основном теоретический труд, описывающий Корни, а также информацию о расположении ближайших Врат.
background.scrivener.table.1.4=**Звездный вальс**. Переплет из тонкой кожи с застежкой в форме кометы. Детализированные астрономические карты, небесные движения и звездные фестивали. Высоко ценится (**100 зм**) за полезность для путешественников.
background.scrivener.table.1.5=**Собор и Крона**. Переплет из крупных листьев поверх пергамента. Номинально детская книга, но на полях содержится информация о путешествиях, питании и ночлеге в облачных лесах.
background.scrivener.table.1.6=**Стеклянный сад**. Спрятана под обложкой другой книги. Еретический труд, описывающий материалы, процедуры и оптимальные места для открытия Врат.
background.scrivener.table.2.prompt=Как вы записываете конфиденциальную информацию?
background.scrivener.table.2.1=**Чернила правды** — Светятся при написании истинных утверждений, но исчезают, если написать ложь.
background.scrivener.table.2.2=**Камень-шифратор** — Пара острых черных камней. Каждый из них расшифровывает любое сообщение, написанное другим.
background.scrivener.table.2.3=**Вечное перо** — Перо, которое пишет на любой поверхности. Однако вам все равно нужна чернильница (_мелкий_).
background.scrivener.table.2.4=**Флакон шепота** — Прошепчите сообщение во флакон, и он воспроизведет его тому, кто откроет его следующим.
background.scrivener.table.2.5=**Кровавая линза** — Извлекает кровь из цели без ее ведома. Капля, помещенная на глаз, раскрывает воспоминания за последний день.
background.scrivener.table.2.6=**Лист эха** — Пустой пергамент (_мелкий_). Тот, кто его разворачивает, видит свои действия за день, медленно проявляющиеся в плотном почерке.
