background.fletchwind.table.1.prompt=How did you earn your bow?
background.fletchwind.table.1.1=**War**. If you are first to attack, your bow gains the _blast_ property for the first round.
background.fletchwind.table.1.2=**Falconry**. You keep a falcon [3 hp, 5 STR, 16 DEX, 4 WIL, claws (d6+d6), bite (d8)]. It only eats live game.
background.fletchwind.table.1.3=**Hunting**. When taking the Supply action, your ability to secure **Rations** increases by **one step** (e.g. 1d4 becomes 1d6).
background.fletchwind.table.1.4=**Tournaments**. Attacks with your bow are _enhanced_ if the target is immobile.
background.fletchwind.table.1.5=**Training**. If you are the first to attack, melee attacks against you are _impaired_ until you take STR damage.
background.fletchwind.table.1.6=**Scouting**. When taking the Travel action, your presence decreases the chance of getting lost by one step (e.g. 4-in-6 becomes 3-in-6).
background.fletchwind.table.2.prompt=What kind of wood is your bow made from?
background.fletchwind.table.2.1=**Western Yew** (d6, _bulky_). Can be wielded as a blunt weapon (d6). Noisy.
background.fletchwind.table.2.2=**Sessile Oak** (d8, _bulky_). Slams into targets. On **Critical Damage** something is torn off.
background.fletchwind.table.2.3=**Stone Pine** (d6, _bulky_). Produces one use of **Sticky Sap** per day. The sap is highly explosive.
background.fletchwind.table.2.4=**White Ash** (d6, _bulky_). Can be used in place of a shield in melee combat (+1 Armor).
background.fletchwind.table.2.5=**Striped Bamboo** (d6). Collapsible, it only requires one slot (but still requires both hands).
background.fletchwind.table.2.6=**Wych Elm** (d6, _bulky_). Protects the bearer from poisons and toxins, so long as they are holding it.
