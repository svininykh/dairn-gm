background.fieldwarden.table.1.prompt=Что вас одолело?
background.fieldwarden.table.1.1=Ненасытная стая вредителей, пожиравшая урожай и животных. Оставшись без средств защиты, вы ушли. Возьмите **Экстракт семян бури** (3 использования). Выпив его, вы сможете бежать в четыре раза быстрее обычного. После этого добавьте две **Усталости**.
background.fieldwarden.table.1.2=Дух урожая, разгневанный скудным подношением. Огонь уничтожил почти все, но вам удалось собрать мешочек **Огненных семян** (к8, _взрыв_, 4 использования).
background.fieldwarden.table.1.3=Рогатый, зубастый демон, едва не убивший вас. Возьмите окровавленный **Костяной нож** (к6). При нанесении _Критического Урона_, его следующая атака становится _Усиленной_ из-за контакта с кровью.
background.fieldwarden.table.1.4=_Увядание_ — вид стеблевой гнили из Корней. Возьмите **Зараженный урожай** (6 использований), который быстро разлагает любое растение, к которому прикасается.
background.fieldwarden.table.1.5=Волки, по крайней мере, вы так думали.. Теперь вы — **Оборотень**  [8 ОЗ, 15 СИЛ, 14 ЛОВ, когти (к6+к6), укус (к8)]. Ваша ВОЛ остается прежней. Вы можете превращаться по желанию (раз в день), но должны пройти проверку ВОЛ, чтобы вернуть себе человеческий облик. Любой, кто выжил после вашей атаки, должен пройти проверку ВОЛ, чтобы избежать заражения.
background.fieldwarden.table.1.6=Воры урожая. Не все из них выжили, но вас было меньше. Начните с +1к4 ОЗ и **Зазубренным фальшионом** (к8).
background.fieldwarden.table.2.prompt=Какой инструмент спас вам жизнь?
background.fieldwarden.table.2.1=**Кнут из кровавой лозы** — Урон к8. При **Критическом Уроне** высасывает из цели кровь, придавая следующей атаке свойство _взрыва_.
background.fieldwarden.table.2.2=**Коробка-хлопушка** — Ручное устройство, издающее громкий шум, отпугивающий большинство существ.
background.fieldwarden.table.2.3=**Солнечная палочка** — Обеспечивает достаточное тепло и свет в течение одного часа (1 использование). **Перезарядка**: оставьте на целый день на ярком солнце.
background.fieldwarden.table.2.4=**Корневая привязь** — Метнув, вы на короткое время свяжете существо размером с волка с землей.
background.fieldwarden.table.2.5=**Зеленый свисток** — Небольшая флейта, успокаивающая растения и облегчающая проход через заросли.
background.fieldwarden.table.2.6=**Вечноцветущий браслет** — Браслет, украшенный цветами, которые никогда не вянут. Когда вы получите **Критический Урон**, цветы обратятся в пыль, но вы сможете считать, что успешно прошли спасбросок (это не избавит вас от потери СИЛ).
