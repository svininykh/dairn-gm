background.bonekeeper.table.1.prompt=Что вы взяли у мертвых?
background.bonekeeper.table.1.1=**Амулет в форме ворона**. Вы можете задавать вопросы мертвым, но за каждое использование добавляйте одну **Усталость**.
background.bonekeeper.table.1.2=**Смертельная рана**, полученная от _ревенанта_. Вас исцелили, но уродливые шрамы сделали вас изгоем. Вам не нужны воздух и пища, но вы все еще подвержены боли и смерти. Застряв между мирами, вы воспринимаетесь мертвыми как один из них.
background.bonekeeper.table.1.3=**Ведро крови** (_громоздкий_) от местного культа смерти. Опустошите его, чтобы поднять слугу из останков. У него будет: 6 ОЗ, Броня 1, 13 СИЛ, 11 ЛОВ, 4 ВОЛ и кулаки с острыми осколками (к8+8а). Вы можете воскресить только одного слугу за раз. Если он уничтожен, вы навсегда теряете 1к4 СИЛ. **Перезарядка**: наполните ведро кровью умирающего воина.
background.bonekeeper.table.1.4=**Похоронная повозка** (+6 слотов) с последнего места работы. В комплекте с упрямым старым **Ослом** (+4 слота;  только +2 слота, если тянет повозку; медленный).
background.bonekeeper.table.1.5=Книга заклинания «Обнаружение магии», украденная из древней библиотеки. Ваша семья служила малоизвестному божеству подземного мира, но вы утратили веру. Несмотря на изгнание, вы продолжаете служить. Обнаружение магии: _вы можете видеть или слышать магические ауры рядом с собой. Книга становится теплой на ощупь, когда неподалеку используется магия_
background.bonekeeper.table.1.6=Маска **чумного доктора**. Ее владелец скончался от болезни, уничтожившей всех, кого вы знали. Ему не следовало ее снимать.
background.bonekeeper.table.2.prompt=Какой инструмент был незаменим в вашей работе?
background.bonekeeper.table.2.1=**Кандалы** — Хоть и старые, все еще эффективны против очень сильных существ. У вас нет ключа.
background.bonekeeper.table.2.2=**Губка** — Предположительно сделана из останков редкого морского существа. Кажется, она никогда не высыхает.
background.bonekeeper.table.2.3=**Шкив** — Отлично подходят для перемещения надгробий, камней или тел.
background.bonekeeper.table.2.4=**Ладан** — Идеален для ритуалов или отпугивания мух. Охлаждает кровь.
background.bonekeeper.table.2.5=**Лом** — Наносит к6а. Иногда нужно просто вскрыть эту чертову штуку!
background.bonekeeper.table.2.6=**Репеллент** — Мощная штука. Его выцветшая этикетка не позволяет точно определить, от _кого_ он должен защищать.Возможно, от всех подряд. 3 использования.
