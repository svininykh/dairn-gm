background.outrider.table.1.prompt=Какой личный кодекс или принцип вы соблюдаете?
background.outrider.table.1.1=**Не проливать кровь невинных**: ни один случайный свидетель не пострадает под вашей защитой. Возьмите **Надежный баклер** (Броня +1). Держа этот  щит, вы не можете быть сдвинуты, пока обе ноги стоят на твердой почве.
background.outrider.table.1.2=**Чтите орудия смерти**: оружие должно уважаться и содержаться в порядке. Возьмите **Оселок из вирмовой кости**. Вы совершаете получасовой ритуал заточки. Ваши атаки оружием считаются _усиленными_ до тех пор, пока не будет нанесен урон СИЛ.
background.outrider.table.1.3=**На встречу смерти**: вы никогда не отступаете, независимо от шансов. Возьмите **Смерть-свисток** с 1 зарядом. Его звук пугает всех, кто его слышит (спасбросок ВОЛ или бегство). **Перезарядка**: уловите последний вздох умирающего воина.
background.outrider.table.1.4=**Чтите мертвых**: смерть — это путь, который проходят все, и он заслуживает уважения. Возьмите **дополнительные 30зм**. Вы всегда кладете две золотые монеты на веки убитого врага. Каким-то образом, они всегда есть у вас под рукой.
background.outrider.table.1.5=**Верность делу**: ваше слово — ваша клятва. Приняв задание, вы доводите его до конца. Возьмите **Счетную палочку**. Когда на ее поверхности отмечается клятва—палочка затвердевает (к8) и остается такой, пока клятва не будет выполнена. Если клятва нарушена, палочка ломается пополам.
background.outrider.table.1.6=**Всегда платите по счетам**: вы всегда возвращаете то, что должны, как монеты, так и услуги. Вы ожидаете того же от других. Возьмите **Книгу учета** с отметками о выполненных обязательствах, затем сделайте еще один бросок по таблице Связей.
background.outrider.table.2.prompt=Какой породы ваша лошадь?
background.outrider.table.2.1=**Тяжелый дестриэ** — Внушительное животное, словно созданное для войны [8 ОЗ, Броня 1, копыта (к10+к10), +2 слота].
background.outrider.table.2.2=**Черноногий дэнди** — Выносливый и адаптивный. **Трудная** или _опасная_ местность становится на одну ступень легче [6 ОЗ, +4 слота].
background.outrider.table.2.3=**Речнозуб** — Впечатляюще сильный, способен нести тяжелые грузы [4 ОЗ, +6 слотов / только +2 слота, если везет двух человек].
background.outrider.table.2.4=**Пегий коб** — Умный, понимает простые команды и даже чувствует опасность [6 ОЗ, +4 слота].
background.outrider.table.2.5=**Липовый белый** — Тренированный и ловкий, способен выполнять сложные маневры в критические моменты, не требуется спасбросок ЛОВ для бегства [4 ОЗ, +3 слота].
background.outrider.table.2.6=**Бродячий туманник** — Дикий, но очень быстрый, даже в _трудной_ местности. Легкий в управлении [4 ОЗ, +2 слота].
