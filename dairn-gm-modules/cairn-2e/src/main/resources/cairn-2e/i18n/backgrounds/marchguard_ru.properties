background.marchguard.table.1.prompt=Почему вы принесли клятву?
background.marchguard.table.1.1=Ваша семья имеет давнюю традицию службы, и вас с раннего возраста обучали выживанию в дикой природе. При выполнении действия «Снабжение» ваш результат увеличивается на одну ступен (например, с 1к4 на 1к6).
background.marchguard.table.1.2=Вы были под приговором, и клятва стала для вас способом избежать наказания. Возьмите **Набор отмычек** и **Ключ** (_мелкий_) от безопасного дома.
background.marchguard.table.1.3=Родившись в знатной семье, вы присоединились к стражам, чтобы избежать семейных проблем. Возьмите украденную перед уходом из дома **Палатку из гусиного пуха** (вмещает двоих).
background.marchguard.table.1.4=Когда ваша семья потеряла все, вы принесли стражам клятву, чтобы не стать обузой. Начните игру с дополнительными **Пайками** (3 порции) и **Метательными ножами** (к6).
background.marchguard.table.1.5=Один из **стражей пограничья** спас вашу жизнь, и это вдохновило вас вступить в их ряды. Возьмите **Силок** и **Альбом для рисования**, заполненный детальными изображениями.
background.marchguard.table.1.6=У вас были темные времена и вы решили, что вашей жизни нужна цель. Вы все еще не уверены, было ли вступление в стражу правильным выбором. Возьмите **Непромокаемый плащ** и **Картографическую бумагу**.
background.marchguard.table.2.prompt=Что вы носите как символ своей клятвы?
background.marchguard.table.2.1=**Впечатляющий значок** — Металлический знак почета от стражи. Он может открывать двери, но оставляет след (_мелкий_).
background.marchguard.table.2.2=**Клятвенный компас** — Указывает не на север, а на ближайшего члена стражи пограничья. Также сообщает, когда они приближаются.
background.marchguard.table.2.3=**Притягивающие камни** — Два черных как смоль камня. Когда их разделяют, они всегда катятся друг к другу.
background.marchguard.table.2.4=**Огненная колба** — Удивительно вкусная смесь из крепкого алкоголя. При броске создает стену пламени высотой 10 фт, которая гаснет через несколько минут (1 использование).
background.marchguard.table.2.5=**Повязка боли** — Прикоснитесь к раненому существу, чтобы перенести его раны на себя (Обменяйте потерянные СИЛ с вашим значением СИЛ). **Перезарядка**: наденьте кольцо, будучи полностью здоровым. При этом вы потеряете  1 СИЛ навсегда (_мелкий_).
background.marchguard.table.2.6=**Бич браконьера** — Сильно пахнущие стрелы (3 использования). Запах достаточно стойкий, чтобы легко отследить местонахождение стрелы.
